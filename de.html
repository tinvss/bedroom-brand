<script>
// Formeln und kleine Helfer: Wege, Preise, Kosten, Statistik
/* ================= Helfer ================= */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ROADY=[2.6,5.3,7.9,10.2,12.5];
const pathOf=src=>{ const r=ROADY.reduce((a,b)=>Math.abs(b-src.y)<Math.abs(a-src.y)?b:a);
  // Wohin die Route liefert, dorthin fährt der Transporter auch sichtbar
  const ziel = (S.uhr&&zielVon(src)==="uhren") ? S.uhr.ort : HQ;
  if(ziel===HQ) return [{x:src.x,y:src.y},{x:src.x,y:r},{x:HQ.x,y:r},{x:HQ.x,y:HQ.y}];
  const rx=ROADS_X.reduce((a,b)=>Math.abs(b-ziel.x)<Math.abs(a-ziel.x)?b:a);
  return [{x:src.x,y:src.y},{x:src.x,y:r},{x:rx,y:r},{x:rx,y:ziel.y},{x:ziel.x,y:ziel.y}]; };
const pathLen=p=>{ let l=0; for(let i=1;i<p.length;i++) l+=dist(p[i-1],p[i]); return l; };
function pointAt(p,d){ for(let i=1;i<p.length;i++){ const s=dist(p[i-1],p[i]); if(s<=0) continue;   // zwei gleiche Punkte im Weg
    if(d<=s){ const f=d/s; return {x:p[i-1].x+(p[i].x-p[i-1].x)*f, y:p[i-1].y+(p[i].y-p[i-1].y)*f}; } d-=s; } return {...p[p.length-1]}; }
function stat(k,n){ if(!S) return; S.stats=S.stats||{}; (S.stats[k]=S.stats[k]||[]).push([S.t,n||1]); }
function perMin(k){ const a=(S.stats||{})[k]; if(!a) return 0; const now=S.t; while(a.length&&now-a[0][0]>60) a.shift(); const span=Math.min(60,Math.max(15,now-(S.statStart||0))); return Math.round(a.reduce((x,y)=>x+y[1],0)*60/span); }
const lagerSum=()=>S.lager.leder+S.lager.gummi+S.lager.metall;
const fachVoll=k=>S.lager[k]>=S.lagerCap;
const basePrice=(d,m)=>MODELS[m].p0/(1+d.s[m]/10);
const fakeLoad=(d,m)=>S.fakes.filter(f=>f.d===d&&f.m===m).reduce((a,f)=>a+f.str,0);
const priceIn=(d,m)=>Math.max(4,Math.round(basePrice(d,m)/(1+fakeLoad(d,m)/6)));
const sealedIn=(d,m)=>Math.max(4,Math.round(basePrice(d,m)*1.3));
const sueCost=()=>150+S.sues*90;
const evo=()=>1+Math.max(0,S.t-S.wakeT)/560+S.sold/1100+(S.uhr?(S.uhr.boutique.verkauft+(S.uhr.boutiquen||[]).reduce((a,B)=>a+(B.verkauft||0),0))/25:0);   // verkaufte Uhren zählen schwer
const routeCost=src=>Math.round(50+14*pathLen(pathOf(src)));
const etagenPreis=n=>S.haus==='uhren'?[0,2500,6000,12000,20000,32000][n]:(S.uhr?undefined:FLOOR_COST[n]);   // Kapitel 2 baut teurer, Sohle ist danach fertig gebaut
const fleetCost=()=>Math.round(250*Math.pow(1.35,S.fleet-2));   // war 1.6, der zehnte Platz kostete damit 6.711
const postCost=()=>140+S.posts.length*40;
const truckUpkeep=0.6, SUPPLY_R=3.4;
const RES=()=>S.research||{}; const postMax=()=>RES().vorrat?30:20;
const speedOf=(W,m)=>{ const M=W.mach[m.t]||{t:[5]}, T=M.t[Math.min(m.lvl||0,M.t.length-1)]; return Math.max(1,Math.round(T*(RES().tempo?0.75:1))); };
const inRange=po=>dist(po,HQ)<=SUPPLY_R||(S.uhr&&S.uhr.ort&&dist(po,S.uhr.ort)<=SUPPLY_R);   // die Manufaktur versorgt ihre Posten selbst                   // pro Sekunde und Transporter
function pop(p,t,c){ S.pops.push({x:p.x,y:p.y,t,c,ttl:1.3}); }
// Was ein Dieb aus der Kasse nimmt: höchstens die Hälfte, nie den Rest.
// Wer auf null gesetzt wird, kann nichts mehr bauen und kommt aus eigener Kraft nicht zurück.
const beuteGeld=max=>Math.max(0,Math.min(Math.floor(S.money/2),max));

const fakeSkill=()=>1+S.t/900+S.sold/700;
// Beute, die Diebe ins Versteck geschleppt haben
function beuteRein(n,L){ if(!L) return; const b=n.beute=n.beute||{money:0,leder:0,gummi:0,metall:0,ammo:0,fin:{}};
  if(L.money) b.money+=L.money; if(L.k) b[L.k]=(b[L.k]||0)+L.n; if(L.ammo) b.ammo+=L.ammo; if(L.fin) b.fin[L.fin]=(b.fin[L.fin]||0)+1; if(L.uhr) b.uhren=(b.uhren||0)+1; }
function beuteWert(n){ const b=n.beute; if(!b) return 0; return Math.round(b.money+ (b.leder+b.gummi+b.metall)*8 + b.ammo*4 + Object.values(b.fin).reduce((a,c)=>a+c,0)*40); }
function beuteText(n){ const b=n.beute; if(!b||!beuteWert(n)) return ""; const t=[];
  if(b.money) t.push(Math.round(b.money)+" Geld"); for(const k of ["leder","gummi","metall"]) if(b[k]) t.push(b[k]+" "+k[0].toUpperCase()+k.slice(1));
  if(b.uhren) t.push(b.uhren+" Uhren"); if(b.band) t.push(b.band+" Bänder"); if(b.ammo) t.push(b.ammo+" Ausrüstung"); const sch=Object.values(b.fin).reduce((a,c)=>a+c,0); if(sch) t.push(sch+" Paar Schuhe");
  return t.join(", "); }
// Ausgehobenes Versteck gibt alles zurück
function beuteZurueck(n){ const b=n.beute; if(!b) return; n.beute=null;
  S.money+=b.money||0; for(const k of ["leder","gummi","metall"]) if(b[k]) S.lager[k]=Math.min(S.lagerCap,S.lager[k]+b[k]);
  if(b.band) S.parts.band=(S.parts.band||0)+b.band;
  if(b.uhren&&S.uhr) S.uhr.fin.klassik=(S.uhr.fin.klassik||0)+b.uhren;
  if(b.ammo) S.ammo=Math.min(S.ammoCap,S.ammo+b.ammo); for(const m in b.fin) S.fin[m]=(S.fin[m]||0)+b.fin[m];
  const w=beuteWert({beute:b}); if(w) pop({x:n.x,y:n.y-0.5},"Beute zurück","#1F7A55"); }

// Wohin eine Route liefert. Sand kann nur die Manufaktur brauchen, Leder und Gummi nur Sohle.
const zielVon=src=> src.k==="sand" ? "uhren" : (src.k==="metall" ? (src.ziel||"sohle") : "sohle");
const zielWerk=tr=>{ const src=S.sources[tr.src]; return src&&zielVon(src)==="uhren"&&S.uhr?uhrWerk():sohleWerk(); };
const zielName=src=>zielVon(src)==="uhren"?"Manufaktur":"Sohle";
const fleetUsed=()=>S.trucks.length+S.vans.length;

// Großprojekt: Preis richtet sich nach deinem Umsatz, nicht nach einer festen Zahl
const umsatzProMin=()=>Math.max(200,Math.round(S.earned/Math.max(2,S.t/60)));
const grossPreis=()=>Math.max(5000,Math.round(umsatzProMin()*20/500)*500);
const grossOffen=()=>!S.flagship&&(S.curRes||Object.keys(S.research||{}).length>0);
const allResearched=()=>TECH.every(x=>RES()[x.k]);
const FW_FORSCHUNGEN=5;   // so viele Stufen braucht die Modewoche, die beiden teuersten darfst du auslassen
const resFertig=()=>TECH.filter(x=>RES()[x.k]).length;
const fwOffen=()=>resFertig()>=FW_FORSCHUNGEN;

<script>
// Simulation im Turm: Nähen, Band, Maschinen, Aufzüge, Warenannahmen
/* ================= Turm ================= */
function sew(){
  if(S.lager.leder<1||S.lager.gummi<1){ return; }
  S.hand++;
  if(S.hand>=6){ S.hand=0; S.lager.leder--; S.lager.gummi--; S.fin.runner++; }
}
// Ware, die oben aus dem Turm kommt, ins passende Lager
function einlagern(W,it){ if(it.k.endsWith("_s")) W.fin[it.k]=(W.fin[it.k]||0)+1; else if(W.models[it.k]) W.fin[it.k]++;
  else if(it.k==="ausr") S.ammo=Math.min(S.ammoCap,S.ammo+10);
  else if(W.lager[it.k]!==undefined) W.lager[it.k]=Math.min(W.lagerCap,W.lager[it.k]+1);
  else if(W.teile.includes(it.k)) W.parts[it.k]=Math.min(W.lagerCap,(W.parts[it.k]||0)+1); }
// Was eine Maschine gerade braucht. "modell" heißt: steht beim gewählten Modell.
const bedarfVon=(W,m)=>{ const M=W.mach[m.t]; if(!M) return {};   // Maschine gehört nicht in dieses Haus
  return M.need==="modell" ? ((W.models[m.model]||{}).need||{}) : M.need; };
// "fertig" ist die Kategorie für fertige Stücke: Sneaker in Sohle, Uhren in Kapitel 2
const katVon=(W,k)=>W.models[k]?"fertig":k;
// Die erste Maschine auf Etage f, die dieses Teil verarbeiten kann (Rohstoffe mit Ziel weiter oben: keine)
function verarbeiter(W,x,f){ const c=katVon(W,x.k); if(x.to&&x.to.f>f) return null;
  return W.floors[f].slots.find(m=>m&&bedarfVon(W,m)[c])||null; }
const PASS_WARTET=2;   // so lange hat das Arbeitsband Vorrang, dann ist das Durchgangsband dran
// Ein Werk ist eine Fabrik: Etagen, Aufzüge, Annahmen, eigenes Lager, eigene Maschinen und Modelle.
// Sohle arbeitet weiter auf denselben Feldern in S, Kapitel 2 bekommt ein zweites Werk daneben.
function sohleWerk(){ S.intakeAcc=S.intakeAcc||{}; S.feedIdx=S.feedIdx||{}; S.intakeLvl=S.intakeLvl||{}; S.parts=S.parts||{schaft:0,sohle:0}; if(S.parts.band===undefined) S.parts.band=0;
  return {name:"sohle", floors:S.floors, lifts:S.lifts, intakes:S.intakes, intakeLvl:S.intakeLvl, intakeAcc:S.intakeAcc, feedIdx:S.feedIdx,
    lager:S.lager, lagerCap:S.lagerCap, parts:S.parts, fin:S.fin, mach:MACH, models:MODELS, teile:["schaft","sohle","band"]}; }
function towerStep(){ werkStep(sohleWerk()); }
function werkStep(W){
  const top=W.floors.length-1;
  for(let f=top;f>=0;f--){
    const F=W.floors[f], d=dirOf(f), e=endOf(f);
    for(let i=0;i<L;i++){
      const m=F.slots[i]; if(!m) continue; if(m.t==="werkstatt") continue;   // steht für sich, nimmt nichts vom Band
      const M=W.mach[m.t];
      if(m.cool>0) m.cool--;
      const need = bedarfVon(W,m);
      const cat=k=>katVon(W,k);
      const mine=x=> !x.to || (x.to.f===f&&x.to.i===i) || x.to.f<f || (x.to.f===f && (d===1 ? i>x.to.i : i<x.to.i));
      const cap=(W.mach[m.t]||{}).puffer||2;   // Eingangspuffer: Material für die nächste Runde darf schon warten
      const takes=x=>need[cat(x.k)] && (m.buf[cat(x.k)]||0)<need[cat(x.k)]*cap && mine(x);
      const put=x=>{ const c=cat(x.k); m.buf[c]=(m.buf[c]||0)+1; if(c==="fertig") m.sm=x.k; };
      if(m.out){ const x=F.lane[i]; if(!x){ F.lane[i]=m.out; m.out=null; } else if(takes(x)){ put(x); F.lane[i]=m.out; m.out=null; } }
      m.blockT = m.out ? (m.blockT||0)+1 : 0;
      if(!m.out&&!(m.cool>0)){ const x=F.lane[i]; if(x&&takes(x)){ put(x); F.lane[i]=null; } }
      m.full = m.t==="equip" && S.ammo>=S.ammoCap-10;
      if(!m.busy&&!m.out&&!m.full&&Object.keys(need).every(k=>(m.buf[k]||0)>=need[k])){ m.busy=true; m.p=0; m.cur=m.sm; for(const k in need) m.buf[k]-=need[k]; if((W.mach[m.t]||{}).kosten) S.money-=W.mach[m.t].kosten; }
      if(m.busy){ m.p++; m.last=S.t; const T=speedOf(W,m);
        if(m.t==="lab"&&m.p>=T){ addSample(m.cur); m.busy=false; m.p=0; m.made=(m.made||0)+1; continue; }
        if(m.t==="atelier"&&m.p>=T){ uhrMuster((m.cur||"klassik").replace(/_s$/,"")); m.busy=false; m.p=0; m.made=(m.made||0)+1; continue; }
        if(m.p>=T){ let o=(W.mach[m.t]||{}).out; if(!o){ m.busy=false; m.p=0; continue; }
          // Zuschnitte in Sohle schneiden auch Lederbänder für die Uhren, so viel wie der Regler sagt
          if(o==="schaft"&&S.uhr&&S.bandAnteil>0){ S.bandAcc=(S.bandAcc||0)+S.bandAnteil; if(S.bandAcc>=1){ S.bandAcc-=1; o="band"; } }
          m.out={k: o==="modell" ? m.model : o==="siegel" ? m.cur+"_s" : o};
          m.busy=false; m.p=0; stat('mk_'+(m.t==="bench"||m.t==="asm"?"schuh":m.t)); if(m.t==="endm") stat('uhr_gebaut');
          m.cool=W.mach[m.t].cool||0; m.made=(m.made||0)+1; } }
    }
    // Erst jetzt verlässt die Ware die Etage, so sieht auch die Maschine auf dem letzten Platz alles
    // Am Etagenende hat das Arbeitsband Vorrang am Aufzug. Wartet das Durchgangsband aber schon
    // PASS_WARTET Takte, ist es dran, sonst steht es bei voller Etage für immer.
    const it=F.lane[e], p0=F.pass&&F.pass[e];
    F.passWait = p0 ? (F.passWait||0)+1 : 0;
    const passZuerst = p0 && F.passWait>=PASS_WARTET;
    // Fertige Ware braucht nicht nach oben: Schuhe, Uhren und Ausrüstung gehen am Etagenende
    // direkt ins Lager. Nur Teile und Rohstoffe fahren mit dem Aufzug weiter.
    // Nur was niemand mehr braucht, rutscht ins Lager. Steht oben ein Siegel, Labor oder Zertifikat,
    // fahren fertige Stücke weiter mit dem Aufzug dorthin.
    const obenBraucht = W.floors.some((F2,i2)=>i2>f && F2.slots.some(m2=>m2&&(bedarfVon(W,m2)||{}).fertig));
    const fertigeWare=x=> x.k==="ausr" || x.k.endsWith("_s") || (!!W.models[x.k] && !obenBraucht);
    if(it && !(passZuerst && f<top)){
      if(f===top||fertigeWare(it)){ einlagern(W,it); if(fertigeWare(it)){ F.ausgang=S.t; F.ausgangK=it.k; } F.lane[e]=null; }
      else if(W.lifts[f].q.length<2){ W.lifts[f].q.push(it); F.lane[e]=null; }
    }
    // Durchgangsband: keine Maschine greift zu, hier staut sich nichts
    if(F.pass){ const p=F.pass[e];
      if(p){ if(f===top||fertigeWare(p)){ einlagern(W,p); if(fertigeWare(p)){ F.ausgang=S.t; F.ausgangK=p.k; } F.pass[e]=null; F.passWait=0; } else if(W.lifts[f].q.length<2){ W.lifts[f].q.push(p); F.pass[e]=null; F.passWait=0; } }
      if(d===1){ for(let i=L-2;i>=0;i--) if(F.pass[i]&&!F.pass[i+1]){ F.pass[i+1]=F.pass[i]; F.pass[i]=null; } }
      else     { for(let i=1;i<L;i++)   if(F.pass[i]&&!F.pass[i-1]){ F.pass[i-1]=F.pass[i]; F.pass[i]=null; } } }
    // Ein Feld, dessen Maschine etwas fertig hat, bleibt frei, bis sie abgelegt hat. Das Band staut sich dahinter.
    const held=j=>F.slots[j]&&F.slots[j].out;
    if(d===1){ for(let i=L-2;i>=0;i--) if(F.lane[i]&&!F.lane[i+1]&&!held(i+1)){ F.lane[i+1]=F.lane[i]; F.lane[i]=null; } }
    else     { for(let i=1;i<L;i++)   if(F.lane[i]&&!F.lane[i-1]&&!held(i-1)){ F.lane[i-1]=F.lane[i]; F.lane[i]=null; } }
  }
  W.lifts.forEach((Lf,f)=>{ Lf.jam = Lf.q.length>=2 ? (Lf.jam||0)+1 : 0;
    if(Lf.jam>12 && Lf.lvl===0) hint("liftHint",[{id:11, tw:()=>liftRect(f), info:true, t:"Der Aufzug kommt nicht hinterher, die rote Kabine ist voll und die Etage darunter staut sich. Tipp den Aufzug an und mach ihn schneller."}]);
    // Weiche oben am Aufzug: Was eine Maschine auf der Etage verarbeiten kann, aufs Arbeitsband, sonst aufs Durchgangsband.
    // Ist oben kein Platz, fährt auch brauchbare Ware unten vorbei, sonst staut sich der Aufzug.
    Lf.c++; if(Lf.q.length&&Lf.c>=LIFT_SPEED[Lf.lvl]){ const up=W.floors[f+1], en=entryOf(f+1), x=Lf.q[0];
      if(!up.pass) up.pass=new Array(L).fill(null);
      const nutzer=verarbeiter(W,x,f+1);
      if(nutzer&&!up.lane[en]){ up.lane[en]=Lf.q.shift(); Lf.c=0; up.weiche={k:x.k,band:"oben",m:nutzer.t,t:S.t}; }
      else if(!up.pass[en]){ up.pass[en]=Lf.q.shift(); Lf.c=0; up.weiche={k:x.k,band:"unten",m:nutzer?nutzer.t:null,t:S.t};
        hint("passHint",[{id:13, tw:()=>bandRect(f+1), info:true, t:"Das dunkle Band unten ist der Durchgang. Was hier keine Maschine braucht, fährt vorbei statt sich zu stauen."}]); } } });
  // Anlieferung aus dem Lager aufs Band: was die Maschinen im Haus brauchen, reihum
  // Jede Warenannahme beliefert ihre Etage und alle darüber, bis die nächste Annahme kommt
  const intakes=W.intakes.slice().sort((a,b)=>a-b);
  const home=ff=>intakes.filter(x=>x<=ff).pop();
  const buckets={}; intakes.forEach(x=>buckets[x]=[]);
  W.floors.forEach((F,ff)=>F.slots.forEach((m,ii)=>{ if(!m) return; const to={f:ff,i:ii}, list=[], nd=bedarfVon(W,m)||{};
    // Was diese Maschine braucht: Rohstoffe aus dem Lager, übrige Zwischenteile aus dem Teilelager
    for(const k in nd){ if(k==="fertig") continue;
      if(W.lager[k]!==undefined){ if(!(m.t==="equip"&&m.full)) list.push(k); }
      else if(W.parts[k]>0 && (m.buf[k]||0)<nd[k]) list.push(k); }   // Bänder braucht in Sohle niemand, sie warten auf den Lieferwagen
    const b=buckets[home(ff)]; if(!b) return;
    for(let r=0;r<(m.prio?2:1);r++) list.forEach(k=>b.push({k,to})); }));
  // Annahmen: unten auf Stufe 1 übers Band, sonst direkt in die bestellende Maschine
  W.intakeAcc=W.intakeAcc||{}; W.feedIdx=W.feedIdx||{};
  for(const fi of intakes){ const F=W.floors[fi], W2=buckets[fi]; if(!F||!W2.length) continue;
    const lvl=(W.intakeLvl||{})[fi]||0, direct = fi>0 || lvl>=1, rate = lvl===0?0.5:lvl===1?1:2;
    W.intakeAcc[fi]=Math.min(2,(W.intakeAcc[fi]||0)+rate);
    let tries=0;
    while(W.intakeAcc[fi]>=1 && tries<W2.length){
      const idx=((W.feedIdx[fi]||0)+tries)%W2.length, w=W2[idx]; tries++;
      const pool=W.lager[w.k]!==undefined?W.lager:(W.parts||{}); if(!(pool[w.k]>0)) continue;
      if(direct){ const TF=W.floors[w.to.f], m=TF&&TF.slots[w.to.i]; if(!m) continue;
        // Direkt in den Eingangspuffer (zwei Runden wie vom Band). Aufs Band gelegt, hat das Material die Felder
        // vor den Maschinen zugestopft, und Ware von weiter vorn kam kaum noch durch.
        const nd=(bedarfVon(W,m)||{})[w.k]||1; if((m.buf[w.k]||0)>=nd*2) continue;
        pool[w.k]--; stat('use_'+w.k); if(w.k==="band") stat('band_weg'); m.buf[w.k]=(m.buf[w.k]||0)+1; }
      else { const en=entryOf(0), nx=en+dirOf(0); if(F.lane[en]||F.lane[nx]) break;
        pool[w.k]--; stat('use_'+w.k); F.lane[en]={k:w.k,to:w.to}; }
      W.intakeAcc[fi]-=1; W.feedIdx[fi]=(idx+1)%W2.length; tries=0;
    }
  }
}

<script>
// Simulation in der Stadt: Transporter, Läden, Banden, Wachen, Razzia, Fälscher
/* ================= Stadt ================= */
// Plätze, auf denen neue Vorkommen auftauchen können
const SRC_SPOTS=[{x:2.5,y:4.2},{x:6.6,y:4.0},{x:1.5,y:8.4},{x:7.6,y:8.8},{x:3.4,y:9.4},{x:5.6,y:6.0},{x:2.2,y:7.0},{x:6.4,y:11.4},{x:1.2,y:3.0},{x:8.2,y:6.6}];
function cityStep(){
  // Transporter
  for(const tr of S.trucks){
    const src=S.sources[tr.src], p=tr.path, Lp=pathLen(p);
    if(tr.dir===-1 && tr.d<=0){ tr.d=0;
      tr.parked=false; tr.dir=1; tr.cargo=RES().laster?10:6; }
    else if(tr.dir===1 && tr.d>=Lp){ tr.d=Lp;
      if(tr.cargo){ const Z=zielWerk(tr); const room=Z.lagerCap-Z.lager[src.k]; if(room<=0){ tr.wait=true; } else { const n=Math.min(room,tr.cargo); Z.lager[src.k]+=n; stat('in_'+src.k,n); tr.cargo-=n; tr.wait=tr.cargo>0; } }
      if(!tr.cargo) tr.dir=-1; }
    if(!tr.wait&&!tr.parked) tr.d+=tr.dir*1.3*DT;
    tr.pos=pointAt(p,Math.max(0,Math.min(Lp,tr.d)));
  }
  // Wer wartet oder an einer leeren Quelle steht, kostet nur ein Drittel: kein Sprit, keine Fahrt
  { const faehrt=S.trucks.filter(t=>!t.wait&&!t.parked).length, steht=S.trucks.length-faehrt;
    S.money-=(faehrt+S.vans.length+steht/3)*truckUpkeep*DT; }
  // Ohne Quelle für einen Rohstoff, den eine Maschine braucht, steht die Fabrik für immer.
  // Deshalb hier ein Netz darunter: fehlt eine Sorte ganz und ist nichts unterwegs, wird sie angefordert.
  if(S.t-(S.srcCheck||0)>10){ S.srcCheck=S.t;
    const werke=[sohleWerk()].concat(S.uhr?[uhrWerk()]:[]);
    const braucht=k=>werke.some(W=>W&&W.floors.some(F=>F.slots.some(m=>m&&(bedarfVon(W,m)||{})[k])));
    for(const k of ["leder","gummi","metall","sand"])
      if(braucht(k)&&!S.sources.some(s=>s.k===k&&s.left>0)&&!(S.newSrc||[]).some(n=>n.k===k)){
        S.newSrc=S.newSrc||[]; S.newSrc.push({k,t:S.t+10}); } }
  // Neue Vorkommen, wenn eins erschöpft ist
  if(S.newSrc&&S.newSrc.length&&S.t>=S.newSrc[0].t){ const ns=S.newSrc[0];
    // Leer gefahrene Quellen halten keinen Platz mehr besetzt, und notfalls entsteht eine auch neben einem Wachposten
    const frei=p=>!S.sources.some(s=>s.left>0&&dist(s,p)<1.2);
    let spots=SRC_SPOTS.filter(p=>frei(p)&&!S.posts.some(s=>dist(s,p)<0.8));
    if(!spots.length) spots=SRC_SPOTS.filter(frei);
    if(!spots.length){ ns.t=S.t+20; }   // alles dicht: später noch einmal versuchen, nicht verwerfen
    else { S.newSrc.shift(); const p=spots[Math.floor(Math.random()*spots.length)];
      S.sources.push({x:p.x,y:p.y,k:ns.k,left:1500,max:1500,trucks:0});
      pop(p,"Neue "+(ns.k==="leder"?"Gerberei":ns.k==="gummi"?"Gummiwerk":ns.k==="sand"?"Sandgrube":"Metallhof")+" entdeckt","#1F7A55"); } }
  // Läden verkaufen aus dem Fertiglager
  for(const d of S.districts){ if(!d.shop) continue; const flag=d.flagship==="sohle";

    if(r.loot){ const L=r.loot; if(L.k&&L.parts) S.parts[L.k]=(S.parts[L.k]||0)+L.n; else if(L.k) S.lager[L.k]=Math.min(S.lagerCap,S.lager[L.k]+L.n); if(L.money) S.money+=L.money;
      if(L.fin) S.fin[L.fin]=(S.fin[L.fin]||0)+1; if(L.uhr&&S.uhr) S.uhr.fin[L.uhr]=(S.uhr.fin[L.uhr]||0)+1; if(L.ammo) S.ammo=Math.min(S.ammoCap,S.ammo+L.ammo);
      pop({x:r.x,y:r.y-0.45},"Beute zurück","#1F7A55"); } }
  S.raiders=S.raiders.filter(r=>r.hp>0&&!r.gone);
  // Streifenwagen holen Gefangene ab
  for(const c of S.caught){ if(c.car||S.t-c.t<0.8) continue;
    const ry=ROADY.reduce((a,b)=>Math.abs(b-c.y)<Math.abs(a-c.y)?b:a), sx=c.x<4.5?-0.7:9.7;
    const car={x:sx,y:ry,home:{x:sx,y:ry},to:{x:c.x,y:ry},state:"in",c}; c.car=car; S.cars.push(car); }
  for(const car of S.cars){ const tgt=car.state==="out"?car.home:car.to, dd=dist(car,tgt);
    if(dd>0.05){ const sp=Math.min(dd,3.2*DT); car.x+=(tgt.x-car.x)/dd*sp; car.y+=(tgt.y-car.y)/dd*sp; car.dir=Math.sign(tgt.x-car.x)||car.dir||1; }
    else if(car.state==="in"){ car.state="wait"; car.w=0.5; }
    if(car.state==="wait"){ car.w-=DT; if(car.w<=0){ car.state="out"; car.c.gone=true; } }
    if(car.state==="out"&&dd<=0.05) car.done=true; }
  S.cars=S.cars.filter(c=>!c.done);
  S.caught=S.caught.filter(c=>!c.gone&&S.t-c.t<10);
  S.decoys=(S.decoys||[]).filter(dc=>{ if(dc.hp<=0){ pop(dc,"Lockvogel zerlegt","#7A7366"); return false; } return true; });
  S.posts=S.posts.filter(po=>{ if(po.hp<=0){ pop(po,"ÜBERRANNT","#B8432F"); return false; } return true; });
  S.pops=S.pops.filter(p=>(p.ttl-=DT)>0);
  // Fälscherbuden wachsen, solange dort dein Modell läuft. Verkaufst du dort nichts mehr,
  // lohnt sich die Kopie nicht und die Bude macht von selbst zu. Vorher wuchsen sie ewig weiter.
  const born=[];
  for(const f of S.fakes){ const laeuft=(f.d.s&&f.d.s[f.m]||0)>0.25;
    f.str = laeuft ? Math.min(4,f.str+0.016*(1+(fakeSkill()-1)*0.5)*DT) : f.str-0.02*DT;
    if(!laeuft) continue;
    if(f.str>=3&&Math.random()<0.0007&&S.fakes.filter(g=>g.d===f.d).length+born.length<5){ f.str=2; const a=Math.random()*6.3;
      born.push({d:f.d,m:f.m,str:0.8,hit:-9,x:f.d.x+Math.cos(a)*0.95,y:f.d.y+Math.sin(a)*0.55-0.2}); } }
  S.fakes.push(...born);
  S.fakes=S.fakes.filter(f=>{ if(f.str<=0.05){ pop(f,"GESCHLOSSEN","#1F7A55"); return false; } return true; });
}

<script>
// Ein Rechenschritt des ganzen Spiels (alle 0,1 Sekunden)
/* ================= Hauptschritt ================= */
let towerTick=0;
function step(){
  if(paused||!S) return;
  S.t+=DT;
  towerTick+=DT; if(towerTick>=0.4){ towerTick=0; towerStep(); if(S.uhr) werkStep(uhrWerk());   // Kapitel 2 läuft daneben
    // Lohn
    S.floors.forEach(F=>F.slots.forEach(m=>{ if(m&&m.t==="bench") S.money-=MACH.bench.wage*0.4/2; }));
  }
  cityStep(); fwStep(); lieferStep(); boutiqueStep(); meisterStep();
  // Meilensteine
  if(!S.factory && S.sold>=FACTORY_AT){ S.factory=true;
    once("fac","Deine erste Werkstatt",`<p style="font-size:15px;color:var(--ink)"><b>${FACTORY_AT} Paare verkauft.</b> Aus dem Kinderzimmer wird eine richtige Werkstatt.</p>
      <p>Ab jetzt kannst du <b>Maschinen</b> hinstellen: Zuschnitt, Presse, Montage. Viel schneller als von Hand, aber sie brauchen viel mehr Material. Das kommt aus der Stadt.</p>`); }
  if(S.factory && S.floors.length>=3 && !$("overlay").innerHTML) hint("resHint",[{id:21, el:()=>$("tForsch"), info:true, t:"Drei Etagen, die Forschung ist offen. Hier machst du deine Firma besser: stärkere Netze, bessere Siegel, schnellere Bänder. Dafür brauchst du ein Labor im Turm, das Schuhe als Muster verbraucht."}]);
  if(lagerSum()===0 && S.sold>3) once("empty","Das Lager ist leer",`<p>Leder und Gummi sind aufgebraucht. Wechsel oben auf <b>Stadt</b> und tipp auf eine Gerberei oder ein Gummiwerk. Eine Route bringt dir Nachschub.</p>`);
}

<script>
// Kapitel 2: Uhren. Eigenes Haus oben im gesperrten Viertel, eigenes Lager, eigene Maschinen.
// Kapitel 1 ist Menge und Tempo, Kapitel 2 sind wenige, wertvolle Stücke.

// Rohstoffe: Metall vom Metallhof oder Schrottplatz, Sand aus der Sandgrube, Lederbänder liefert Sohle
const RAW2={metall:{n:"Metallhof",col:"#6C7A89"}, sand:{n:"Sandgrube",col:"#D8C08A"}, band:{n:"Lederband",col:"#8A5A35"}};

const UHREN={
 klassik:{n:"Klassik", p0:1200, col:"var(--ink)",   c2:"#2B2A26", unlock:0,    need:{gehaeuse:1,glas:1,uhrwerk:1,band:1}},
 chrono: {n:"Chrono",  p0:2100, col:"var(--court)", c2:"#2E6FE4", unlock:3000, need:{gehaeuse:1,glas:1,uhrwerk:2,band:1}}};

// Takte à 0,4 Sekunden. Die Feinmechanik ist bewusst der Engpass, ein Uhrwerk braucht drei Zahnräder.
const MACH2={
 giess:  {n:"Gießerei",       need:{metall:1},                cost:400,  d:"Metall rein, Gehäuse raus.", t:[6],  factory:true, out:"gehaeuse"},
 ofen:   {n:"Glasofen",       need:{sand:1},                  cost:400,  d:"Sand rein, Glas raus.",      t:[5],  factory:true, out:"glas"},
 fein:   {n:"Feinmechanik",   need:{metall:1},                cost:600,  d:"Macht aus Metall ein Zahnrad. Langsam, drei davon ergeben ein Uhrwerk.", t:[10], factory:true, out:"zahnrad"},
 werk:   {n:"Uhrwerk-Montage",need:{zahnrad:3},               cost:900,  d:"Drei Zahnräder werden ein Uhrwerk.", t:[8], factory:true, out:"uhrwerk"},
 endm:   {n:"Endmontage",     need:"modell",                  cost:1200, d:"Gehäuse, Glas, Uhrwerk und Band werden eine Uhr. Modell wählbar.", t:[10], factory:true, out:"modell"},
 atelier:{n:"Atelier",         need:{fertig:1},                cost:700,  d:"Nimmt fertige Uhren als Muster und macht daraus Forschung. Was hier landet, verkaufst du nicht.", t:[8], factory:true},
 zert:   {n:"Zertifikat",     need:{fertig:1},                cost:800,  d:"Beglaubigt fertige Uhren. Beglaubigte Uhren bringen mehr und schützen gegen Replikas.", t:[5], factory:true, out:"siegel"},
 werkstatt:{n:"Werkstatt für Einzelstücke", need:{}, cost:0, gross:true, factory:true, t:[1],
   d:"Ein Platz für ein einziges Stück. Hier baust du das Meisterstück. Sie steht nicht am Band und produziert nichts, und die Crews reden über sie."}};

const UHR_TEILE=["gehaeuse","glas","zahnrad","uhrwerk"];

// Das Haus oben. Entsteht beim Einstieg in Kapitel 2, danach steht es im Spielstand.
function neuesUhrenwerk(){
  return {boutique:{s:{klassik:0,chrono:0}, cd:0, verkauft:0, umsatz:0}, boutiquen:[], repliken:[],
    research:{}, curRes:null, resProg:{}, rp:{},
    floors:[{lane:new Array(L).fill(null), slots:new Array(L).fill(null)}], lifts:[],
    intakes:[0], intakeLvl:{}, intakeAcc:{}, feedIdx:{},
    lager:{metall:0,sand:0,band:0}, lagerCap:30,
    parts:{gehaeuse:0,glas:0,zahnrad:0,uhrwerk:0}, fin:{klassik:0,chrono:0},
    open:{klassik:true,chrono:false}};
}
// Sicht auf das Uhrenwerk für die Turm-Simulation
function uhrWerk(){ const U=S.uhr; if(!U) return null;
  U.intakeAcc=U.intakeAcc||{}; U.feedIdx=U.feedIdx||{}; U.intakeLvl=U.intakeLvl||{};
  return {name:"uhren", floors:U.floors, lifts:U.lifts, intakes:U.intakes, intakeLvl:U.intakeLvl, intakeAcc:U.intakeAcc, feedIdx:U.feedIdx,
    lager:U.lager, lagerCap:U.lagerCap, parts:U.parts, fin:U.fin, open:U.open, mach:MACH2, models:UHREN, teile:UHR_TEILE}; }

// Grundstücke oben im Viertel. Der Preis hängt am Exit-Geld, das teuerste kostet die Hälfte davon.
// Näher an der Hauptstraße heißt kurzer Weg für den Lieferwagen aus Sohle und weniger Angriffsfläche.
// Viertel oben, Koordinaten mit negativem y liegen über der alten Stadt
const OBERSTADT=[{n:"Boulevard", x:2.2, y:-1.5}, {n:"Galerie", x:6.8, y:-1.5}, {n:"Promenade", x:4.5, y:-3.2}];
const GRUNDSTUECKE=[
 {id:"mitte", n:"An der Hauptstraße", x:4.5, y:-0.9, teil:0.5,  d:"Gleich hinter der Absperrung. Kurzer Weg für den Lieferwagen, leicht zu schützen."},
 {id:"west",  n:"Westseite",          x:1.5, y:-2.6, teil:0.34, d:"Mitten in der Oberstadt. Mittlerer Weg, mittleres Risiko."},
 {id:"rand",  n:"Ganz oben am Rand",  x:8.1, y:-3.5, teil:0.2,  d:"Die Ecke am Stadtrand. Der Lieferwagen fährt quer durch die ganze Stadt, dafür bleibt viel Geld für Maschinen."}];
const grundPreis=g=>Math.round((S.exitMoney||10000)*g.teil/100)*100;
function kaufeGrundstueck(g){ if(S.uhr||S.money<grundPreis(g)) return;
  // Die Oberstadt wird echte Stadt: zwei Viertel für Boutiquen kommen dazu
  OBERSTADT.forEach(o=>{ if(!S.districts.some(d=>d.n===o.n)) S.districts.push({n:o.n, x:o.x, y:o.y, shop:false, oben:true, s:{runner:0,court:0,hightop:0}, heat:{runner:0,court:0,hightop:0}, cd:0}); });
  S.money-=grundPreis(g); S.uhr=neuesUhrenwerk(); S.uhr.ort={id:g.id,n:g.n,x:g.x,y:g.y}; S.haus="uhren";
  S.sources.push({x:6.2,y:3.0,k:"sand",n:"Sandgrube",left:1500,max:1500,trucks:0});
  S.liefer={pos:{x:HQ.x,y:HQ.y}, d:0, cargo:0, state:"laden", weg:lieferWeg(g)};   // der gepanzerte Wagen gehört dazu
  S.bandAnteil=S.bandAnteil||0;
  once("ch2haus","Dein zweites Haus",`<p>Du hast <b>${g.n}</b> gekauft. Oben baust du Uhren: wenige Stücke, hoher Wert.</p>
    <p>Die Kette ist länger als bei Sneakern. Metall wird zu Gehäusen und zu Zahnrädern, Sand zu Glas, drei Zahnräder ergeben ein Uhrwerk. Am Ende kommt ein Lederband von Sohle dazu.</p>
    <p>Sohle läuft weiter und schneidet die Bänder. Lässt du sie verkommen, steht hier oben die Endmontage.</p>`); }

// Häuser: beliebig viele, angezeigt wird immer das aktive. Kapitel 1 hat nur Sohle.
function haeuser(){ const a=[{id:"sohle", n:"Sohle", werk:sohleWerk}];
  if(S.uhr) a.push({id:"uhren", n:"Uhren", werk:uhrWerk});
  return a; }
function aktivesHaus(){ const a=haeuser(); return a.find(h=>h.id===S.haus)||a[0]; }
function aktivesWerk(){ return aktivesHaus().werk(); }
// Was in einem Haus gerade klemmt, für den roten Punkt am Umschalter
function hausSorgen(h){ const W=h.werk(); let n=0;
  for(const F of W.floors) for(const m of F.slots){ if(!m) continue;
    if((m.blockT||0)>25) n++;                                   // kommt lange nicht los
    else if(!m.busy&&!m.out){ const nd=bedarfVon(W,m)||{};      // wartet auf Material, das auch im Lager fehlt
      for(const k in nd) if(k!=="fertig"&&!(m.buf[k]>=nd[k])&&W.lager[k]!==undefined&&W.lager[k]<1) { n++; break; } } }
  return n; }

// Der Weg des Lieferwagens: aus dem Turm über die Hauptstraßen nach oben zum Haus
function lieferWeg(ort){ const rx=ROADS_X.reduce((a,b)=>Math.abs(b-ort.x)<Math.abs(a-ort.x)?b:a);
  // erst auf der Querstraße nach oben, dann auf einer Längsstraße hoch, erst am Ende ins Viertel
  return [{x:HQ.x,y:HQ.y},{x:HQ.x,y:ROADY[0]},{x:rx,y:ROADY[0]},{x:rx,y:ort.y},{x:ort.x,y:ort.y}]; }
const LIEFER_LADUNG=10;
// Er holt Bänder aus Sohle und bringt sie nach oben. Unterwegs ist er das beste Ziel für die Banden.
function lieferStep(){ const v=S.liefer; if(!v||!S.uhr) return; const Lp=pathLen(v.weg);
  if(v.state==="laden"){ v.pos={x:HQ.x,y:HQ.y}; v.d=0;
    const n=Math.min(LIEFER_LADUNG, S.parts.band||0, S.uhr.lagerCap-S.uhr.lager.band);
    if(n<=0) return; S.parts.band-=n; v.cargo=n; v.state="hoch"; return; }
  if(v.state==="hoch"){ v.d+=1.1*DT; if(v.d>=Lp){ v.d=Lp;
      const n=Math.min(v.cargo, S.uhr.lagerCap-S.uhr.lager.band);
      S.uhr.lager.band+=n; stat('band_hoch',n); if(n) pop(S.uhr.ort,"+"+n+" Bänder","#1F7A55"); v.cargo=0; v.state="runter"; } }
  else if(v.state==="runter"){ v.d-=1.4*DT; if(v.d<=0){ v.d=0; v.state="laden"; } }
  v.pos=pointAt(v.weg,Math.max(0,Math.min(Lp,v.d))); }

// Der Markt für Uhren: wenige Käufer, hohe Preise. Die Sättigung hält länger an als bei Sneakern.
// Die erste Boutique sitzt am Haus, weitere eröffnest du in Vierteln der Stadt.
function boutiquen(){ const U=S.uhr; return U ? [U.boutique].concat(U.boutiquen||[]) : []; }
const replikaLast=(B,m)=>(S.uhr.repliken||[]).filter(r=>r.b===B&&r.m===m).reduce((a,r)=>a+r.str,0);
const uhrPreisIn=(B,m)=>Math.max(80,Math.round(UHREN[m].p0/(1+(B.s[m]||0)/3)/(1+replikaLast(B,m)/5)));
const uhrPreis=(m)=>{ const bs=boutiquen(); return bs.length?Math.max(...bs.map(B=>uhrPreisIn(B,m))):UHREN[m].p0; };
const boutiquePreis=()=>Math.round(4000*Math.pow(1.6,(S.uhr.boutiquen||[]).length));

function boutiqueStep(){ const U=S.uhr; if(!U) return;
  for(const B of boutiquen()){
    for(const m in B.s) B.s[m]*=Math.pow(0.96,DT);        // Sättigung klingt langsam ab
    B.cd-=DT; if(B.cd>0) continue;
    let best=null, bp=0, zert=false;
    for(const m in UHREN){ if((U.fin[m+"_s"]||0)>0){ const p=Math.round(uhrPreisIn(B,m)*1.35); if(p>bp){bp=p;best=m;zert=true;} }
      if(U.fin[m]>0){ const p=uhrPreisIn(B,m); if(p>bp){bp=p;best=m;zert=false;} } }
    const fd=B.d!==undefined&&S.districts[B.d]&&S.districts[B.d].flagship==='uhren';
    if(!best){ B.cd=1; continue; }
    if(fd) bp=Math.round(bp*1.25);
    U.fin[zert?best+"_s":best]--; S.money+=bp; S.earned+=bp; B.verkauft=(B.verkauft||0)+1; B.umsatz=(B.umsatz||0)+bp;
    B.s[best]+=1; B.heat=B.heat||{}; B.heat[best]=(B.heat[best]||0)+(zert?0.3:1);
    stat('uhr_verkauft'); stat('uhr_'+best);
    const ort=B.d!==undefined?S.districts[B.d]:U.ort; if(ort) pop(ort,"+"+bp.toLocaleString("de-DE"),"#1F7A55");
    B.cd=fd?8:14;                                         // etwa alle vierzehn Sekunden kommt ein Käufer, im Flagship öfter
    // Läuft ein Modell gut, tauchen Replikas auf. Zertifikate halten sie klein.
    if(zert){ const meine=(U.repliken||[]).filter(r=>r.b===B&&r.m===best); if(meine.length){ const w=meine.sort((a,b)=>b.str-a.str)[0]; w.str-=RES2().serien?2.4:1.2; w.hit=S.t; } }
    if((B.heat[best]||0)>=(fd?6:12)){ B.heat[best]=0; if((U.repliken||[]).filter(r=>r.b===B).length<3){
      U.repliken.push(Object.assign({b:B,m:best,str:1.2,hit:-9}, replikaOrt(ort)));
      once("replika","Replikas",`<p>Deine <b>${UHREN[best].n}</b> läuft so gut, dass sie kopiert wird. Eine Replika drückt den Preis in dieser Boutique.</p><p>Dagegen hilft ein <b>Zertifikat</b> in der Manufaktur: Beglaubigte Uhren bringen mehr und drängen die Kopien zurück.</p>`); } }
  }
  U.repliken=(U.repliken||[]).filter(r=>{ r.str=Math.min(4,r.str+0.01*DT); return r.str>0.1; });
}
// Die Kopie stellt sich neben die Boutique, aber nie außerhalb der Karte: am rechten Rand also links daneben.
const replikaOrt=o=>{ const x=(o&&o.x)||4.5, y=(o&&o.y)||0;
  return {x: Math.min(8.4, Math.max(0.6, x>7 ? x-1.1 : x+1.1)), y: Math.min(13.4, Math.max(-3.4, y+0.4))}; };
function boutiqueBauen(d,gratis){ const c=gratis?0:boutiquePreis(); if(!S.uhr||S.money<c) return;
  S.money-=c; S.uhr.boutiquen.push({d:S.districts.indexOf(d), s:{klassik:0,chrono:0}, cd:0, verkauft:0, umsatz:0, heat:{}});
  d.boutique=true; pop(d,"Boutique eröffnet","#1F7A55"); }
// Der Testknopf erscheint nur mit ?test in der Adresse, damit Tester nicht versehentlich alles überspringen
function testModus(){ try{ return /[?&]test/.test(location.search); }catch(e){ return false; } }
// Testknopf: bringt das Spiel in den Zustand nach dem Exit, damit Kapitel 2 ohne langes Vorspiel geprüft werden kann
function testSprungKapitel2(){ TECH.forEach(x=>S.research[x.k]=true);
  S.factory=true; S.tutDone=true; tutOn=false; tutQ=[];
  // Sohle so aufbauen, wie sie bei einem echten Spieler vor dem Exit aussieht: vier Etagen, volle Straßen, Routen, Posten, Läden
  const M2=(t,m)=>({t,buf:{},busy:false,p:0,model:m||"runner",lvl:0});
  S.money=99999; S.lagerCap=120; S.ammoCap=100; S.ammo=60; S.fleet=8;
  ["court","hightop"].forEach(k=>S.open[k]=true);
  while(S.floors.length<4){ const n=S.floors.length; S.floors.push({lane:new Array(L).fill(null), slots:new Array(L).fill(null)}); S.lifts.push({q:[],c:0,lvl:2}); }
  S.lifts.forEach(l=>l.lvl=2); S.intakes=[0,1,2,3]; S.intakeLvl={0:2,1:2,2:2,3:2};
  // Ausgewogen: ein Zuschnitt und eine Presse versorgen zwei Montagen, sonst staut sich der Turm
  S.floors[0].slots=[M2("cut"),M2("press"),M2("asm"),M2("asm"),null,M2("equip"),M2("seal")];
  S.floors[1].slots=[M2("cut"),M2("press"),M2("asm","court"),M2("asm","court"),null,M2("seal"),null];
  S.floors[2].slots=[M2("cut"),M2("press"),M2("asm","hightop"),M2("asm"),null,M2("lab"),null];
  S.floors[3].slots=[M2("cut"),M2("press"),M2("asm"),M2("asm"),null,M2("equip"),null];
  S.lager={leder:120,gummi:120,metall:120};
  if(!S.trucks.length){ [0,1,2,3,4].forEach(i=>{ addTruck(S.sources[i]); if(i<2) addTruck(S.sources[i]); }); }
  if(S.posts.length<3) [[4.5,10.5],[2.5,11.5],[6.5,11.5]].forEach(([x,y])=>S.posts.push({x,y,hp:70,max:70,cd:0,stock:30}));
  S.districts.forEach((d,i)=>{ if(i<3&&d.nest===undefined) d.shop=true; });
  S.fw={state:"won",t0:S.t,got:{runner:30,court:20,hightop:10}}; S.exited=true;
  S.exitMoney=Math.max(45000, valuation()); S.money=S.exitMoney;
  S.sold=Math.max(S.sold,600); S.lagerCap=Math.max(S.lagerCap,120);
  Object.assign(S.seen,{fac:1,raid:1,rob:1,fake:1,resHint:1,doorHint:1,liftHint:1,passHint:1,mktHint:1,shopHint:1,intakeUp:1,empty:1,firstPost:1,fwHint:1,fwgo:1,ch2:1});
  $("sheet").innerHTML=""; switchView("stadt"); grundstueckSheet(); }
</script>
<script>
// Forschung der Manufaktur. Das Atelier verbraucht fertige Uhren als Muster, teure Modelle forschen schneller.
// Jede Stufe ist die Antwort auf eine Bedrohung, keine Prozente ohne Grund.
const TECH2=[
 {k:"tresor",  n:"Tresor",                  d:"Fertige Uhren im Lager sind sicher. Crews erwischen nur noch, was gerade auf dem Band liegt.", cost:{klassik:8}},
 {k:"begleit", n:"Begleitschutz",           d:"Ein Wachmann fährt im Lieferwagen mit und wehrt die meisten Überfälle ab.",                    cost:{klassik:12}},
 {k:"serien",  n:"Seriennummern",           d:"Replikas verlieren doppelt so schnell, Zertifikate wirken stärker.",                           cost:{klassik:16}},
 {k:"alarm",   n:"Alarmanlage",             d:"In den Boutiquen geht der Alarm los. Die Hälfte der Diebe wird dabei geschnappt.",             cost:{klassik:12,chrono:6}},
 {k:"werfer",  n:"Netzwerfer auf dem Dach", d:"Wirft Netze im Bogen auf Verstecke in Reichweite. Tipp ein Versteck an. Jeder Schuss kostet 5 Ausrüstung.", cost:{klassik:20,chrono:10}},
 {k:"weite",   n:"Größere Wurfweite",       d:"Der Netzwerfer wirft deutlich weiter.",                                                        cost:{chrono:18}},
 {k:"tourbillon", n:"Tourbillon",           d:"Das feinste Uhrwerk, das es gibt. Öffnet die Werkstatt für Einzelstücke und damit den Auftrag für dein Meisterstück.", cost:{klassik:24,chrono:12}}];

const RES2=()=>(S.uhr&&S.uhr.research)||{};
const werferWeite=()=>RES2().weite?7.5:4.5;
const resTech2=()=>S.uhr&&S.uhr.curRes&&TECH2.find(x=>x.k===S.uhr.curRes);
function resPct2(){ const T=resTech2(); if(!T) return 0; let a=0,b=0;
  for(const [k,v] of Object.entries(T.cost)){ a+=Math.min(v,(S.uhr.resProg||{})[k]||0); b+=v; } return Math.floor(a/b*100); }
function checkRes2(){ const T=resTech2(); if(!T) return;
  if(Object.entries(T.cost).every(([k,v])=>((S.uhr.resProg||{})[k]||0)>=v)){
    S.uhr.research[T.k]=true; S.uhr.curRes=null; S.uhr.resProg={};
    pop(S.uhr.ort,"Erforscht: "+T.n,"#7B5BC0");
    if(T.k==="tourbillon") once("tourb","Das Tourbillon",`<p>Du kannst jetzt das feinste Uhrwerk der Welt bauen. Nicht in Serie, das geht nicht. Nur einmal.</p>
      <p>Stell dafür in der Manufaktur eine <b>Werkstatt für Einzelstücke</b> hin. Dort wartet der Auftrag, auf den du die ganze Zeit hingearbeitet hast.</p>`);
    else if(T.k==="werfer") once("werfer","Netzwerfer auf dem Dach",`<p>Auf dem Dach deiner Manufaktur steht jetzt ein <b>Netzwerfer</b>. Der Kreis auf der Karte zeigt, wie weit er wirft.</p>
      <p>Tipp ein Versteck in diesem Kreis an, dann fliegt ein Netz im Bogen dorthin. Ein paar Treffer, und die Hütte ist weg, ohne dass du einen Wachposten abziehst. Jeder Schuss kostet <b>5 Ausrüstung</b> aus deinem Lager.</p>`);
    else hint("res2_"+T.k,[{id:"r2"+T.k, el:()=>$("tForsch"), info:true, t:`Erforscht: ${T.n}. ${T.d}`}],true); } }
// Ein Muster aus dem Atelier
function uhrMuster(modell){ const U=S.uhr; if(!U) return; const T=resTech2();
  U.rp=U.rp||{}; U.resProg=U.resProg||{};
  if(T&&T.cost[modell]&&(U.resProg[modell]||0)<T.cost[modell]){ U.resProg[modell]=(U.resProg[modell]||0)+1; checkRes2(); }
  else U.rp[modell]=(U.rp[modell]||0)+1; }
function selectRes2(k){ const U=S.uhr; U.rp=U.rp||{}; const alt=resTech2();
  if(alt) for(const m in U.resProg) U.rp[m]=(U.rp[m]||0)+U.resProg[m];
  U.curRes=k; U.resProg={}; const T=resTech2();
  for(const [m,v] of Object.entries(T.cost)){ const nimm=Math.min(v,U.rp[m]||0); U.resProg[m]=nimm; U.rp[m]-=nimm; }
  checkRes2(); }

function forschungSheet2(){ reopen=forschungSheet2; const U=S.uhr;
  const hatAtelier=U.floors.some(F=>F.slots.some(m=>m&&m.t==="atelier"));
  let h=`<h3>Forschung der Manufaktur</h3><p>Ein <b>Atelier</b> im Haus nimmt fertige Uhren als Muster. Was dort landet, verkaufst du nicht. Die Forschung läuft weiter, auch wenn du woanders bist.</p>`;
  if(!hatAtelier) h+=`<p style="color:var(--bad);font-weight:700">Du hast noch kein Atelier. Stell eins auf, in Laufrichtung hinter der Endmontage.</p>`;
  const T=resTech2();
  if(T) h+=`<div style="background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-weight:800"><span>${T.n}</span><span>${resPct2()} %</span></div>
    <div style="height:12px;background:var(--line);border-radius:7px;overflow:hidden;margin:8px 0 2px"><i style="display:block;height:100%;width:${resPct2()}%;background:#7B5BC0"></i></div>
    <div style="font-size:12.5px;color:var(--soft)">${Object.entries(T.cost).map(([m,v])=>((S.uhr.resProg||{})[m]||0)+" von "+v+" "+UHREN[m].n).join(" · ")}</div></div>`;
  else h+=`<p style="font-weight:700;color:var(--ink)">Gerade wird nichts erforscht. Muster landen im Vorrat.</p>`;
  for(const X of TECH2){ const fertig=RES2()[X.k], laeuft=U.curRes===X.k;
    const offen = X.k!=="weite" || RES2().werfer;
    h+=`<div class="opt ${fertig||!offen?"off":""}" ${fertig||laeuft||!offen?"":`data-r2="${X.k}"`}>
      <div><b>${X.n}${fertig?" · erforscht":laeuft?" · läuft":""}</b><span>${offen?X.d:"Erst mit dem Netzwerfer."}</span>
      <span style="display:block;margin-top:4px">${Object.entries(X.cost).map(([m,v])=>v+" "+UHREN[m].n).join(", ")}</span></div>
      <em>${fertig?"✓":laeuft?resPct2()+"%":"Wählen"}</em></div>`; }
  openSheet(h,()=>document.querySelectorAll("[data-r2]").forEach(b=>b.onclick=()=>{ selectRes2(b.dataset.r2); forschungSheet2(); }));
}
</script>
<script>
// Das Finale von Kapitel 2. Kein "produziere mehr", sondern "erschaffe das eine".
// Eintrittskarte ist die Werkstatt für Einzelstücke, danach vier seltene Zutaten, dann mehrere Minuten Bangen.

const MEISTER_TEILE={
 saphir:  {n:"Saphirglas",        d:"Der Glasofen schmilzt vierzig Scheiben Glas zu einer einzigen.",             braucht:{glas:40}},
 werkE:   {n:"Tourbillon",        d:"Dreißig Uhrwerke gehen dabei drauf. Übrig bleibt eines, das alle anderen schlägt.", braucht:{uhrwerk:30}},
 stein:   {n:"Meteoritengestein", d:"Liegt am äußersten Kartenrand. Ein Wagen muss es holen.",                    expedition:true},
 band:    {n:"Das Armband",       d:"Näht der allererste Mitarbeiter aus dem Kinderzimmer.",                      mitarbeiter:true}};
const MEISTER_BAUZEIT=150;   // so lange liegt die Uhr halbfertig in der Werkstatt
// Die Werkstatt wird in drei Raten gebaut. Sonst spart man zwanzig Minuten am Stück,
// ohne dass unterwegs etwas passiert. Jede Rate macht etwas auf.
const MEISTER_STUFEN=[
 {n:"Der Raum",        d:"Vier Wände und ein Tresor. Hier sammelst du die Zutaten."},
 {n:"Der Wagen",       d:"Ein gepanzerter Wagen. Erst mit ihm fährt die Expedition an den Kartenrand."},
 {n:"Die Montagebank", d:"Der Tisch, auf dem das Stück entsteht. Danach kannst du den Zusammenbau starten."}];
const mwStufe=()=>S.mw?(S.mw.stufe||1):0;
const ratePreis=()=>Math.round((S.mw?S.mw.preis:grossPreis())/3/100)*100;

const werkstattDa=()=>!!(S.uhr&&S.uhr.floors.some(F=>F.slots.some(m=>m&&m.t==="werkstatt")));
const meisterOffen=()=>!!(S.uhr&&RES2().tourbillon&&werkstattDa());
// Kaufbar ist sie einmal: nicht ohne Forschung, nicht zweimal und nicht mehr, wenn das Stück gebaut ist
const werkstattKaufbar=()=>!!(S.uhr&&RES2().tourbillon&&!werkstattDa()&&!(S.mw&&S.mw.phase==="fertig"));
const werkstattGrund=()=>!S.uhr||!RES2().tourbillon?"Erst mit dem Tourbillon aus der Forschung.":werkstattDa()?"Du hast schon eine. Mehr als eine gibt es nicht.":"Dein Meisterstück ist gebaut. Ein zweites gibt es nicht.";
// Der erste Mitarbeiter: Steht in Sohle noch eine Werkbank, näht er das Band umsonst. Sonst muss man ihn zurückholen.
const mitarbeiterDa=()=>S.floors.some(F=>F.slots.some(m=>m&&m.t==="bench"));
const mitarbeiterPreis=()=>Math.max(4000,Math.round(umsatzProMin()*8/100)*100);

function meisterStart(){ if(S.mw||!S.uhr||!RES2().tourbillon) return;
  S.mw={phase:"sammeln", teile:{}, t0:S.t, preis:grossPreis(), stufe:1};
  once("mw","Der Auftrag",`<p>Ein großes Uhrenhaus hat von dir gehört. Es will <b>ein einziges Stück</b>, das beste, das du bauen kannst.</p>
    <p>Vier Zutaten: Saphirglas, ein Tourbillon, ein Zifferblatt aus <b>Meteoritengestein</b> vom Rand der Karte, und das Armband, genäht von deinem allerersten Mitarbeiter.</p>
    <p>Deine Werkstatt ist erst ein Raum. Zwei Ausbauten fehlen: der Wagen für die Expedition und die Montagebank, auf der das Stück entsteht. Jede kostet so viel wie der Raum.</p>
    <p>Am Ende liegt die Uhr zweieinhalb Minuten halbfertig da. Wer sie in dieser Zeit erwischt, nimmt dir alles.</p>`); }
function werkstattAusbauen(){ const M=S.mw; if(!M||M.stufe>=3) return; const c=ratePreis(); if(S.money<c) return;
  S.money-=c; M.stufe++; pop(S.uhr.ort,MEISTER_STUFEN[M.stufe-1].n+" steht","#7B5BC0");
  if(M.stufe===2) once("mwstufe2","Der Wagen steht",`<p>Der gepanzerte Wagen ist fertig. Jetzt kannst du die <b>Expedition</b> an den Kartenrand schicken und das Meteoritengestein holen.</p>`);
  if(M.stufe===3) once("mwstufe3","Die Montagebank steht",`<p>Die Werkstatt ist fertig. Sobald alle vier Zutaten da sind, kannst du den <b>Zusammenbau</b> starten.</p>`); }

// Zutaten abgeben
function meisterGeben(k){ const M=S.mw; if(!M||M.phase!=="sammeln"||M.teile[k]) return;
  const T=MEISTER_TEILE[k], U=S.uhr;
  if(T.braucht){ for(const t in T.braucht){ if((U.parts[t]||0)<T.braucht[t]) return; }
    for(const t in T.braucht) U.parts[t]-=T.braucht[t]; }
  else if(T.mitarbeiter&&!mitarbeiterDa()){ const c=mitarbeiterPreis(); if(S.money<c) return; S.money-=c; M.zurueckgeholt=true; }
  M.teile[k]=true; pop(S.uhr.ort,T.n+" bereit","#1F7A55"); if(alleDa()) alleDaHinweis();
}
const alleDa=()=>{ const M=S.mw; return !!M&&Object.keys(MEISTER_TEILE).every(x=>M.teile[x]); };
function alleDaHinweis(){ once("mwbereit","Alles da",`<p>Die vier Zutaten liegen in deiner Werkstatt. Den Zusammenbau startest du selbst, wenn du bereit bist.</p>
  <p>Er dauert <b>${MEISTER_BAUZEIT} Sekunden</b>, und so lange liegt die Uhr halbfertig da. Kommt in dieser Zeit eine Crew an die Manufaktur, ist alles weg: die Uhr und die Zutaten.</p>
  <p>Stell vorher Wachposten hin und heb die Verstecke in der Nähe aus.</p>`); }
// Expedition an den Kartenrand. Ein einzelner Wagen, lange Strecke, und alle wissen, was er holt.
const EXP_ZIEL={x:8.5,y:-3.8};
function expeditionStart(){ const M=S.mw; if(!M||M.teile.stein||M.exp||mwStufe()<2) return;
  M.exp={pos:{x:HQ.x,y:HQ.y}, d:0, weg:[{x:HQ.x,y:HQ.y},{x:HQ.x,y:ROADY[0]},{x:8.5,y:ROADY[0]},EXP_ZIEL], zurueck:false, hp:90, max:90};
  once("exp","Die Expedition",`<p>Ein einzelner Wagen fährt quer durch die Stadt bis an den Rand und gräbt das Meteoritengestein aus.</p><p>Die Crews wissen, was er holt. Erwischen sie ihn, ist die Fahrt umsonst und du schickst ihn neu los.</p>`); }
function expeditionVerloren(){ const M=S.mw; if(!M||!M.exp) return;
  pop(M.exp.pos,"Expedition verloren","#B8432F"); M.exp=null; S.alarmT=S.t;
  once("expweg","Der Wagen ist weg",`<p>Sie haben die Expedition erwischt. Das Gestein ist verloren, der Wagen auch.</p><p>Du kannst sie neu losschicken. Diesmal besser mit Wachposten an der Strecke, oder mit Begleitschutz aus der Forschung.</p>`); }
function expeditionStep(){ const M=S.mw; if(!M||!M.exp) return; const e=M.exp, L2=pathLen(e.weg);
  if(!e.zurueck&&e.d>=L2&&!e.hat){ e.grab=(e.grab||0)+DT; if(e.grab<6) return; e.hat=true; e.zurueck=true; pop(e.pos,"Gestein geladen","#1F7A55"); }
  e.d += (e.zurueck?-1:1)*1.1*DT;
  if(!e.zurueck&&e.d>L2) e.d=L2;
  if(e.zurueck&&e.d<=0){ M.exp=null; M.teile.stein=true; pop(HQ,"Meteoritengestein da","#1F7A55"); if(alleDa()) alleDaHinweis(); return; }
  e.pos=pointAt(e.weg,Math.max(0,Math.min(L2,e.d)));
}
// Zusammenbau: drei Minuten Bangen
function meisterBauen(){ const M=S.mw; if(!M||M.phase!=="sammeln"||!alleDa()||mwStufe()<3) return; M.phase="bau"; M.bauT=S.t;
  once("mwbau","Sie liegt in der Werkstatt",`<p>Alle Zutaten sind da. Die Uhr liegt jetzt <b>drei Minuten halbfertig</b> in deiner Werkstatt.</p>
    <p>Ein Überfall auf die Manufaktur in dieser Zeit kostet dich alles. Stell alles hin, was du hast.</p>`); }
function meisterStep(){ const M=S.mw; if(!M) return;
  if(M.exp) expeditionStep();
  if(M.phase!=="bau") return;
  if(S.t-M.bauT>=MEISTER_BAUZEIT){ M.phase="fertig"; meisterFertig(); }
}
// Ein Raub in der Bauzeit zerstört das Stück
function meisterUeberfall(){ const M=S.mw; if(!M||M.phase!=="bau") return;
  M.phase="sammeln"; M.teile={}; M.kaputt=(M.kaputt||0)+1;
  once("mwweg"+M.kaputt,"Sie haben sie mitgenommen",`<p>Während die Uhr halbfertig in der Werkstatt lag, ist eine Crew durchgekommen. Das Stück ist weg, die Zutaten auch.</p>
    <p>Du kannst von vorn anfangen. Diesmal mit mehr Wachleuten an der Manufaktur.</p>`); }
function meisterFertig(){ paused=true; setPauseUI();
  const conf=`<div class="confetti">${Array.from({length:40},(_,i)=>`<i style="left:${(i*29)%100}%;background:${["#E4572E","#2E6FE4","#1F9E6E","#F2B441","#7B5BC0"][i%5]};animation-delay:${(i%9)*0.1}s;animation-duration:${1.6+(i%5)*0.3}s"></i>`).join("")}</div>`;
  const preis=Math.max(50000,Math.round(umsatzProMin()*60/1000)*1000);   // eine Stunde Umsatz, drei Großprojekte wert
  S.money+=preis; S.meisterFertig=true;
  $("overlay").innerHTML=`<div class="over"><div class="box win">${conf}<h2>Das Meisterstück</h2>
    <p>Sie ist fertig. Ein Gehäuse aus deinem Metall, Saphirglas, ein Tourbillon, ein Zifferblatt aus Meteoritengestein.
    Das Armband hat ${S.mw.zurueckgeholt?"dein erster Mitarbeiter genäht, den du zurückgeholt hast":"dein allererster Mitarbeiter genäht, der seit dem Kinderzimmer bei dir ist"}.</p>
    <p style="font-size:26px;font-weight:800;color:var(--money);margin:6px 0 10px">${preis.toLocaleString("de-DE")}</p>
    <p style="font-size:13px">${S.sold} Paare verkauft · ${(S.uhr.boutique.verkauft||0)+(S.uhr.boutiquen||[]).reduce((a,B)=>a+(B.verkauft||0),0)} Uhren verkauft · ${S.mw.kaputt?S.mw.kaputt+" Mal verloren · ":""}${Math.round(S.t/60)} Minuten</p>
    <button id="mwok">Weiter</button></div></div>`;
  const b=$("mwok"); if(b) b.onclick=()=>{ $("overlay").innerHTML=""; paused=false; setPauseUI(); };
}
function werkstattWeg(){ if(!S.uhr||!S.mw||S.mw.phase!=="fertig") return;
  S.uhr.floors.forEach(F=>F.slots.forEach((m,i)=>{ if(m&&m.t==="werkstatt") F.slots[i]=null; })); }
// Fenster in der Manufaktur
function meisterSheet(){ reopen=meisterSheet; const M=S.mw;
  if(!M){ openSheet(`<h3>Das Meisterstück</h3><p>Ein großes Uhrenhaus will ein einziges Stück von dir. Dafür brauchst du das Tourbillon aus der Forschung und eine Werkstatt für Einzelstücke in der Manufaktur.</p>
    <p>${RES2().tourbillon?"Tourbillon erforscht.":"Tourbillon fehlt noch."}</p>`); return; }
  if(M.phase==="fertig"){ openSheet(`<h3>Das Meisterstück ist fertig</h3><p>Es steht in der Vitrine des Uhrenhauses, mit deinem Namen darauf. Ein zweites gibt es nicht.</p>
    <p>Die Werkstatt hat ihre Arbeit getan. Du kannst sie abbauen und den Platz wieder benutzen. Geld gibt es dafür keins zurück.</p>
    <div class="opt" data-weg="1"><div><b>Werkstatt abbauen</b><span>Der Platz wird frei.</span></div><em></em></div>`,
    ()=>{ const w=document.querySelector("[data-weg]"); if(w) w.onclick=()=>{ werkstattWeg(); $("sheet").innerHTML=""; }; }); return; }
  if(M.phase==="bau"){ const rest=Math.ceil(MEISTER_BAUZEIT-(S.t-M.bauT));
    openSheet(`<h3>Die Uhr liegt in der Werkstatt</h3><p style="color:var(--bad);font-weight:700">Noch ${rest} Sekunden. Ein Überfall auf die Manufaktur kostet dich jetzt alles.</p>
      <p>Wachposten in der Nähe, Netze werfen, notfalls den Netzwerfer. Danach gehört das Stück dir.</p>`); return; }
  const U=S.uhr, st=mwStufe();
  let h=`<h3>Das Meisterstück</h3><p>Deine Werkstatt: <b>${MEISTER_STUFEN[st-1].n}</b>, Ausbaustufe ${st} von 3.</p>`;
  if(st<3){ const c=ratePreis(), ok=S.money>=c, naechste=MEISTER_STUFEN[st];
    h+=`<div class="opt ${ok?"":"off"}" ${ok?`data-aus="1"`:""}><div><b>Ausbauen: ${naechste.n}</b><span>${naechste.d}</span></div><em>${c.toLocaleString("de-DE")}</em></div>`; }
  h+=`<p style="margin-top:10px">Vier Zutaten, jede ein eigener kleiner Auftrag.</p>`;
  for(const [k,T] of Object.entries(MEISTER_TEILE)){ const da=M.teile[k];
    let kann=false, hinweis="";
    if(T.braucht){ kann=Object.entries(T.braucht).every(([t,v])=>(U.parts[t]||0)>=v);
      hinweis=Object.entries(T.braucht).map(([t,v])=>`${U.parts[t]||0} von ${v} ${t==="glas"?"Glas":"Uhrwerke"}`).join(", "); }
    else if(T.expedition){ kann=false; hinweis=M.exp?"Der Wagen ist unterwegs.":"Schick den Wagen los."; }
    else if(T.mitarbeiter){ kann=mitarbeiterDa()||S.money>=mitarbeiterPreis();
      hinweis=mitarbeiterDa()?"Er steht noch in deiner Werkstatt in Sohle.":`Du hast ihn abgebaut. Ihn zurückzuholen kostet ${mitarbeiterPreis().toLocaleString("de-DE")}.`; }
    h+=`<div class="opt ${da?"off":""}" ${!da&&kann?`data-mt="${k}"`:""}><div><b>${T.n}${da?" · bereit":""}</b><span>${T.d}</span><span style="display:block;margin-top:3px">${da?"":hinweis}</span></div><em>${da?"✓":""}</em></div>`;
    if(k==="stein"&&!da&&!M.exp) h+= st>=2
      ? `<div class="opt" data-exp="1"><div><b>Expedition losschicken</b><span>Ein Wagen fährt an den Stadtrand und zurück. Die Crews wissen, was er holt.</span></div><em></em></div>`
      : `<div class="opt off"><div><b>Expedition losschicken</b><span>Dafür fehlt der gepanzerte Wagen. Bau die Werkstatt eine Stufe aus.</span></div><em></em></div>`;
  }
  if(alleDa()) h+= st>=3
    ? `<div class="opt" data-bau="1"><div><b>Zusammenbau starten</b><span>${MEISTER_BAUZEIT} Sekunden liegt die Uhr halbfertig da. Ein Überfall auf die Manufaktur kostet dich alles.</span></div><em>los</em></div>`
    : `<div class="opt off"><div><b>Zusammenbau starten</b><span>Dafür fehlt die Montagebank. Bau die Werkstatt fertig aus.</span></div><em></em></div>`;
  openSheet(h,()=>{ const ab=document.querySelector("[data-aus]"); if(ab) ab.onclick=()=>{ werkstattAusbauen(); meisterSheet(); };
    const bb=document.querySelector("[data-bau]"); if(bb) bb.onclick=()=>{ meisterBauen(); meisterSheet(); };
    document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ meisterGeben(b.dataset.mt); meisterSheet(); });
    const e=document.querySelector("[data-exp]"); if(e) e.onclick=()=>{ expeditionStart(); meisterSheet(); }; });
}
</script>
<script>
// Forschung: Muster, Fortschritt, Zeitschätzung, was blockiert
/* ================= Forschung ================= */

const resTech=()=>S.curRes&&TECH.find(x=>x.k===S.curRes);
function resPct(){ const T=resTech(); if(!T) return 0; let a=0,b=0; for(const [k,v] of Object.entries(T.cost)){ a+=Math.min(v,S.resProg[k]||0); b+=v; } return Math.floor(a/b*100); }
function checkRes(){ const T=resTech(); if(!T) return;
  if(Object.entries(T.cost).every(([k,v])=>(S.resProg[k]||0)>=v)){ S.research[T.k]=true; S.curRes=null; S.resProg={}; nextRes();
    pop(HQ,"Erforscht: "+T.n,"#7B5BC0");
    hint("resDone",[{id:40, el:()=>$("tForsch"), info:true, t:`Erforscht: ${T.n}. ${T.d} Ist eine Forschung fertig, steht das oben im Balken, und du wählst dort die nächste aus.`}],true); } }
function addSample(m){ S.sampLog=(S.sampLog||[]).filter(x=>S.t-x.t<90); S.sampLog.push({t:S.t,m}); const T=resTech();
  if(T&&T.cost[m]&&(S.resProg[m]||0)<T.cost[m]){ S.resProg[m]=(S.resProg[m]||0)+1; checkRes(); } else S.rp[m]=(S.rp[m]||0)+1; }
// Wählt man etwas, während schon geforscht wird, kommt es in die Warteschlange. Noch einmal tippen nimmt es wieder raus.
function selectRes(k){ S.resQ=S.resQ||[];
  if(S.curRes&&S.curRes!==k){ const i=S.resQ.indexOf(k); if(i>=0) S.resQ.splice(i,1); else if(!RES()[k]) S.resQ.push(k); return; }
  starteRes(k); }
function nextRes(){ S.resQ=(S.resQ||[]).filter(k=>!RES()[k]); const k=S.resQ.shift(); if(k) starteRes(k); }
function starteRes(k){ S.resStart=S.t; const old=resTech(); if(old) for(const m in S.resProg) S.rp[m]=(S.rp[m]||0)+S.resProg[m];
  S.curRes=k; S.resProg={}; const T=resTech();
  for(const [m,v] of Object.entries(T.cost)){ const take=Math.min(v,S.rp[m]||0); S.resProg[m]=take; S.rp[m]-=take; } checkRes(); }
function sampRate(m){ const log=(S.sampLog||[]).filter(x=>x.m===m&&S.t-x.t<60);
  if(log.length>=2) return (log.length-1)/Math.max(1,log[log.length-1].t-log[0].t);
  if(log.length===1) return S.t-log[0].t>20 ? 1/(S.t-log[0].t) : null;
  return S.t-(S.resStart||0)>25 ? 0 : null; }
function resEta(){ const T=resTech(); if(!T) return null; let e=0; for(const [m,v] of Object.entries(T.cost)){ const rest=v-(S.resProg[m]||0); if(rest<=0) continue; const r=sampRate(m); if(r===null) return -1; if(r<=0) return Infinity; e=Math.max(e,rest/r); } return e; }
function firstEmptyAfterAsm(){ for(let f=0;f<S.floors.length;f++){ const F=S.floors[f], d=dirOf(f); for(let i=0;i<L;i++){ if(!F.slots[i]||F.slots[i].t!=="asm") continue;
    for(let j=i+d;j>=0&&j<L;j+=d) if(!F.slots[j]) return [f,j]; } }
  for(let f=0;f<S.floors.length;f++){ const i=S.floors[f].slots.findIndex(x=>!x); if(i>=0) return [f,i]; } return null; }
const findMW=(W,pred)=>{ for(let f=0;f<W.floors.length;f++) for(let i=0;i<L;i++){ const m=W.floors[f].slots[i]; if(m&&pred(m)) return [f,i]; } return null; };
const findM=(pred)=>{ for(let f=0;f<S.floors.length;f++) for(let i=0;i<L;i++){ const m=S.floors[f].slots[i]; if(m&&pred(m)) return [f,i]; } return null; };
// Welche Muster noch fehlen: "25 Runner, 8 Court". Ohne diese Angabe sieht man nur Prozente.
function resFehlt(T,prog,namen){ if(!T) return [];
  return Object.entries(T.cost).map(([m,v])=>[m,v-((prog||{})[m]||0)]).filter(([,r])=>r>0).map(([m,r])=>({m,r,n:namen[m].n})); }
const resFehltText=(T,prog,namen)=>resFehlt(T,prog,namen).map(x=>x.r+" "+x.n).join(", ");
function resBlock(){ const T=resTech(); if(!T) return null;
  const need=Object.entries(T.cost).filter(([k,v])=>(S.resProg[k]||0)<v).map(([k])=>k);
  if(!findM(m=>m.t==="lab")) return {msg:"Du hast noch kein Labor. Es macht aus fertigen Schuhen Forschung.", go:()=>guide({tower:firstEmptyAfterAsm, opt:'[data-b="lab"]', optT:"Nimm das Labor.", done:()=>!!findM(m=>m.t==="lab")},"Tipp auf diesen Platz. Hier, in Laufrichtung hinter einer Montage, kommen Schuhe beim Labor an.")};
  for(const k of need){ const n=MODELS[k].n;
    if(!S.open[k]) return {msg:`Dafür brauchst du ${n}-Schuhe. Entwirf das Modell zuerst unten beim Markt.`, go:()=>guide({el:()=>document.querySelector(`[data-un="${k}"]`), done:()=>S.open[k]},`Hier entwirfst du den ${n}. Danach stellst du eine Montage auf ${n} um.`)};
    if(!findM(m=>m.t==="asm"&&m.model===k)) return {msg:`Dein Labor bekommt keine ${n}-Schuhe. Stell eine Montage auf ${n} um.`, go:()=>guide({tower:()=>findM(m=>m.t==="asm"), opt:`[data-mo="${k}"]`, optT:`Wähl ${n}.`, done:()=>!!findM(m=>m.t==="asm"&&m.model===k)},`Tipp diese Montage an.`)}; }
  for(const k of need) if(S.t-(S.resStart||0)>25 && sampRate(k)===0 && findM(m=>m.t==="lab")) return {msg:`Bei deinen Laboren kommen keine ${MODELS[k].n}-Schuhe an. Ein Labor muss in Laufrichtung hinter der ${MODELS[k].n}-Montage stehen, und kein Siegel davor darf sie abfangen.`, go:()=>guide({tower:()=>findM(m=>m.t==="asm"&&m.model===k)},`Das ist eine ${MODELS[k].n}-Montage. Ein Labor muss auf ihrem Weg liegen, in Laufrichtung dahinter, auf derselben oder einer höheren Etage.`)};
  if(S.t-(S.resStart||0)>25 && need.every(k=>sampRate(k)===0)) return {msg:"Dein Labor bekommt keine Schuhe. Es muss in Laufrichtung hinter einer Montage stehen.", go:()=>guide({tower:()=>findM(m=>m.t==="lab"), opt:"[data-mv]", optT:"Tipp auf Verschieben, danach auf einen freien Platz hinter einer Montage."},"Dieses Labor steht vor der Montage, dort kommen keine Schuhe an. Tipp es an.")};
  return null; }
</script>
<script>
// Fashion Week, Angebot der Investorin, gesperrtes Gebiet oben in der Stadt
/* ================= Fashion Week und Exit ================= */

function fwStart(){ S.fw={state:"live",t0:S.t,got:{runner:0,court:0,hightop:0}}; $("sheet").innerHTML=""; switchView("stadt");
  once("fwgo","Fashion Week",`<p>Du hast fünf Minuten. Die Modewoche will <b>30 Runner, 20 Court und 10 Hightop</b>. Alles, was fertig wird, geht erst an die Bestellung, erst danach in deine Läden.</p><p>Die Banden wissen, dass bei dir gerade viel zu holen ist. <b>Sie greifen doppelt so oft an.</b></p>`); }
function fwStep(){ const F=S.fw; if(!F||F.state!=="live") return;
  for(const m in FW_NEED){ while(F.got[m]<FW_NEED[m]){ const k=(S.fin[m+"_s"]||0)>0?m+"_s":S.fin[m]>0?m:null; if(!k) break; S.fin[k]--; F.got[m]++; } }
  if(Object.keys(FW_NEED).every(m=>F.got[m]>=FW_NEED[m])){ F.state="won"; exitOffer(); }
  else if(S.t-F.t0>FW_TIME){ F.state="lost"; F.retry=S.t+120; S.lastExplain=-99;
    once("fwlost"+Math.round(S.t),"Nicht geschafft",`<p>Die Modewoche ist vorbei, die Bestellung war nicht komplett. In zwei Minuten kannst du es noch mal versuchen. Tipp: Court und Hightop vorher auf Vorrat produzieren.</p>`); } }
function valuation(){ const mins=Math.max(10,(S.t-(S.wakeT||0))/60); const perMinRev=S.earned/Math.max(10,S.t/60);
  return Math.round((perMinRev*45 + S.floors.length*800 + S.districts.filter(d=>d.shop).length*1500)/100)*100; }
function exitOffer(){ const v=valuation(); S.offer=v; paused=true; setPauseUI();
  const conf=`<div class="confetti">${Array.from({length:40},(_,i)=>`<i style="left:${(i*29)%100}%;background:${["#E4572E","#2E6FE4","#1F9E6E","#F2B441","#7B5BC0"][i%5]};animation-delay:${(i%9)*0.1}s;animation-duration:${1.6+(i%5)*0.3}s"></i>`).join("")}</div>`;
  $("overlay").innerHTML=`<div class="over"><div class="box win">${conf}<h2>Die Fashion Week gehört dir</h2>
    <p>Alle Paare geliefert. Am Abend spricht dich eine Investorin an: Sie will <b>Sohle</b> kaufen.</p>
    <p style="font-size:26px;font-weight:800;color:var(--money);margin:6px 0 10px">${v.toLocaleString("de-DE")}</p>
    <p>Berechnet aus deinem Umsatz, deinen Etagen und Läden. Sohle läuft danach weiter und bleibt als Zulieferer auf der Karte.</p>
    <p style="font-size:13px">${S.sold} Paare verkauft · ${S.floors.length} Etagen · ${S.cleared} Verstecke ausgehoben · ${Math.round(S.t/60)} Minuten</p>
    <button id="acc">Annehmen</button><button id="later" style="background:none;color:var(--soft);border:1px solid var(--line);margin-top:8px">Noch nicht, weiterspielen</button></div></div>`;
  $("acc").onclick=()=>{ S.exited=true; S.exitMoney=v; S.money+=v; S.earned+=v; S.exitBezahlt=true; $("overlay").innerHTML=""; paused=false; setPauseUI();
    once("ch2","Neues Gebiet freigeschaltet",`<p>Mit ${v.toLocaleString("de-DE")} im Rücken kannst du oben in der Stadt deine nächste Firma gründen: eine <b>Uhrenmanufaktur</b>. Sie braucht Lederbänder von Sohle, und die müssen erst mal heil ankommen.</p><p>Sohle läuft weiter und schneidet die Bänder. Oben im Turm schaltest du zwischen den Häusern um.</p>`); };
  $("later").onclick=()=>{ $("overlay").innerHTML=""; paused=false; setPauseUI(); };
}
function regionCard(){ const el=$("region"); if(!el||!el.dataset) return; let h;
  const zst=zoneState(); if((zst==="locked"||zst==="wait")&&!S.exited){ if(el.dataset.h!==""){ el.dataset.h=""; el.innerHTML=""; } el.onclick=null; return; }
  if(S.exited&&!S.uhr) h=`<div class="rg ready"><b>Kapitel 2 · Grundstück wählen</b><span>Drei Lagen, drei Preise. Tippen zum Ansehen.</span></div>`;
  else if(S.exited) h=`<div class="rg"><b>Kapitel 2 · ${S.uhr.ort.n}</b><span>Deine Uhrenmanufaktur. Oben im Turm umschalten.</span></div>`;
  else if(S.fw&&S.fw.state==="live"){ const left=Math.max(0,FW_TIME-(S.t-S.fw.t0)), mm=Math.floor(left/60), ss=String(Math.floor(left%60)).padStart(2,"0");
    h=`<div class="rg live"><b>Fashion Week · noch ${mm}:${ss}</b><div class="fwb">${Object.keys(FW_NEED).map(m=>`<div>${shoeIcon(m,18)} ${S.fw.got[m]}/${FW_NEED[m]}<i><u style="width:${Math.round(S.fw.got[m]/FW_NEED[m]*100)}%;background:${MODELS[m].c2}"></u></i></div>`).join("")}</div></div>`; }
  else if(S.fw&&S.fw.state==="won") h=`<div class="rg ready"><b>Angebot der Investorin</b><span>${S.offer.toLocaleString("de-DE")} · Tippen zum Ansehen</span></div>`;
  else if(fwOffen()&&(!S.fw||S.t>=(S.fw.retry||0))) h=`<div class="rg ready"><b>Fashion Week starten</b><span>Die große Bestellung. Schaffst du sie, wartet ein Käufer für deine Firma.</span></div>`;
  else if(S.fw&&S.fw.state==="lost") h=`<div class="rg"><b>Fashion Week</b><span>Nächster Versuch in ${Math.ceil((S.fw.retry-S.t))} Sekunden.</span></div>`;
  else { const n=TECH.filter(x=>RES()[x.k]).length;
    h=`<div class="rg"><b>${lockSvgG()}Gesperrtes Gebiet</b><span>Erforsche alles (${n} von ${TECH.length}), dann kommt die Fashion Week. Wer sie liefert, bekommt ein Angebot für seine Firma und das nächste Gebiet.</span></div>`; }
  if(el.dataset.h!==h){ el.dataset.h=h; el.innerHTML=h; }
  el.onclick=()=>{ if(S.exited&&!S.uhr) return grundstueckSheet(); if(S.fw&&S.fw.state==="won"&&!S.exited) exitOffer(); else if(!S.exited&&fwOffen()&&(!S.fw||(S.fw.state!=="live"&&S.t>=(S.fw.retry||0)))) fwStart(); }; }
const lockSvgG=()=>`<svg width="11" height="13" viewBox="0 0 11 13" style="vertical-align:-1px;margin-right:6px"><rect x="1" y="6" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M3 6V4a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>`;

function zoneState(){ if(S.exited) return "open"; if(S.fw&&S.fw.state==="live") return "live"; if(S.fw&&S.fw.state==="won") return "offer";
  if(fwOffen()&&(!S.fw||S.t>=(S.fw.retry||0))) return "ready"; if(S.fw&&S.fw.state==="lost") return "wait"; return "locked"; }
function drawZone(c,F,t){ const w=W*T, h=TOPR()*T, st=zoneState();
  if(st==="open"){ return drawOberstadt(c,F,t,w,h); }   // freigeschaltet: richtige Stadt statt Kulisse
  // Skyline eines vornehmeren Viertels
  c.fillStyle=st==="open"?"#D9D0BF":"#BDB5A6"; c.fillRect(0,0,w,h);
  for(let k=0;k<11;k++){ const bx=k*w/11, bh=h*(0.35+hsh(k,3,1)*0.45), bw=w/11-4;
    c.fillStyle=st==="open"?"#EFE8DA":"#A69E8F"; c.fillRect(bx+2,h-bh-T*0.35,bw,bh);
    c.fillStyle=st==="open"?"#F2D38A":"#958D7F"; for(let r=0;r<4;r++) for(let q=0;q<2;q++) if(hsh(k,r,q)>0.4) c.fillRect(bx+6+q*bw*0.45,h-bh-T*0.35+8+r*12,bw*0.22,5); }
  c.fillStyle="#8E877A"; c.fillRect(0,h-T*0.35,w,T*0.35);
  if(st!=="open"){ c.fillStyle="rgba(40,36,30,.42)"; c.fillRect(0,0,w,h-T*0.35);
    c.strokeStyle="rgba(255,255,255,.08)"; c.lineWidth=10; for(let k=-4;k<14;k++){ c.beginPath(); c.moveTo(k*T,0); c.lineTo(k*T+h,h); c.stroke(); } }
  // Absperrung
  for(let k=0;k<18;k++){ c.fillStyle=k%2?"#FBF8F2":"#B8432F"; c.fillRect(k*w/18,h-T*0.42,w/18,T*0.12); }
  c.textAlign="center";
  // Die eigene Manufaktur oben im Viertel
  if(S.uhr&&S.uhr.ort){ const ox=S.uhr.ort.x*T, oy=h-T*0.42;
    c.fillStyle="rgba(0,0,0,.35)"; c.fillRect(ox-T*0.36+4,oy-T*1.0+5,T*0.72,T*1.0);
    c.fillStyle="#24231F"; c.fillRect(ox-T*0.36,oy-T*1.0,T*0.72,T*1.0);
    c.fillStyle="#C98A1B"; c.fillRect(ox-T*0.36,oy-T*1.0,T*0.72,T*0.09);
    for(let r=0;r<3;r++) for(let q=0;q<2;q++){ c.fillStyle=hsh(r,q,Math.floor(t*0.5))>0.3?"#F2D38A":"#4A4843"; c.fillRect(ox-T*0.24+q*T*0.26,oy-T*0.78+r*T*0.22,T*0.18,T*0.13); } }
  const title = st==="open"?"KAPITEL 2 · BALD": st==="ready"?"FASHION WEEK STARTEN": st==="live"?"FASHION WEEK LÄUFT": st==="offer"?"ANGEBOT ANSEHEN": st==="wait"?"NEUER VERSUCH GLEICH":"GESPERRT";
  const sub = st==="locked"?`Noch ${FW_FORSCHUNGEN-resFertig()} Forschungen · ${resFertig()} von ${FW_FORSCHUNGEN}`: st==="ready"?"Hier tippen": st==="open"?`Startkapital ${S.exitMoney.toLocaleString("de-DE")}`: st==="wait"?`in ${Math.ceil(S.fw.retry-S.t)} Sekunden`: "";
  if(st==="ready"||st==="offer"){ c.fillStyle="rgba(242,180,65,"+(0.55+Math.sin(t*4)*0.25)+")"; c.beginPath(); c.roundRect(w/2-T*2.4,h*0.2,T*4.8,h*0.5,10); c.fill(); }
  // Schloss
  if(st==="locked"||st==="wait"){ const lx=w/2, ly=h*0.3; c.fillStyle="#FBF8F2"; c.beginPath(); c.roundRect(lx-T*0.2,ly,T*0.4,T*0.32,4); c.fill();
    c.strokeStyle="#FBF8F2"; c.lineWidth=3; c.beginPath(); c.arc(lx,ly,T*0.13,Math.PI,0); c.stroke(); }
  c.fillStyle=(st==="ready"||st==="offer")?"#1B1A17":"#FBF8F2"; c.font=`800 ${T*0.3}px ${F}`;
  c.fillText(title,w/2,(st==="locked"||st==="wait")?h*0.3+T*0.75:h*0.42);
  if(sub){ c.font=`700 ${T*0.2}px ${F}`; c.fillText(sub,w/2,(st==="locked"||st==="wait")?h*0.3+T*1.05:h*0.42+T*0.32); }
}
function grundstueckSheet(){ reopen=grundstueckSheet;
  let h=`<h3>Kapitel 2 · Grundstück wählen</h3><p>Oben stehen die hohen Häuser. Hier baust du deine Uhrenmanufaktur. Der Weg von Sohle nach oben ist der Weg deines Lieferwagens: kurz heißt sicher, lang heißt billig.</p>`;
  for(const g of GRUNDSTUECKE){ const c=grundPreis(g), ok=S.money>=c;
    h+=`<div class="opt ${ok?"":"off"}" ${ok?`data-gr="${g.id}"`:""}><div><b>${g.n}</b><span>${g.d}</span></div><em>${c.toLocaleString("de-DE")}</em></div>`; }
  h+=`<p style="margin-top:4px">Du hast ${Math.round(S.money).toLocaleString("de-DE")}. Was übrig bleibt, sind deine ersten Maschinen.</p>`;
  openSheet(h,()=>document.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{ kaufeGrundstueck(GRUNDSTUECKE.find(g=>g.id===b.dataset.gr)); $("sheet").innerHTML=""; }));
}

// Die Oberstadt: dieselben Blöcke und Straßen wie unten, dazu deine Manufaktur
function drawOberstadt(c,F,t,w,h){
  c.fillStyle="#CFC6B4"; c.fillRect(0,0,w,h);
  for(let y=0;y<TOPR();y++) for(let x=0;x<W;x++){ const cx=x+0.5, cy=y+0.5;
    if(ROADS_X.some(r=>Math.abs(cx-r)<0.55) || Math.abs(cy-(TOPR()-0.4))<0.5) continue;
    const r=hsh(x,y+40), park=r<0.1;
    if(park){ c.fillStyle="#B9C79B"; c.fillRect(x*T+2,y*T+2,T-4,T-4); continue; }
    const inset=T*(0.08+hsh(x,y+40,3)*0.06), roof=["#EFE8DA","#E4DCCD","#E9E1D2"][Math.floor(hsh(x,y+40,5)*3)];
    c.fillStyle="rgba(60,50,35,.2)"; c.fillRect(x*T+inset+3,y*T+inset+4,T-inset*2,T-inset*2);
    c.fillStyle=roof; c.fillRect(x*T+inset,y*T+inset,T-inset*2,T-inset*2);
    c.fillStyle="rgba(201,138,27,.25)"; c.fillRect(x*T+inset,y*T+inset+T*0.3,T-inset*2,2); }
  c.fillStyle="#8E877A"; ROADS_X.forEach(r=>c.fillRect(r*T-T*0.34,0,T*0.68,h)); c.fillRect(0,(TOPR()-0.4)*T-T*0.3,w,T*0.6);
  c.strokeStyle="rgba(255,255,255,.5)"; c.lineWidth=1.3; c.setLineDash([7,8]);
  ROADS_X.forEach(r=>{ c.beginPath(); c.moveTo(r*T,0); c.lineTo(r*T,h); c.stroke(); });
  c.beginPath(); c.moveTo(0,(TOPR()-0.4)*T); c.lineTo(w,(TOPR()-0.4)*T); c.stroke(); c.setLineDash([]);
  // Deine Manufaktur
  if(S.uhr&&S.uhr.ort){ const ox=S.uhr.ort.x*T, oy=(S.uhr.ort.y+TOPR())*T;
    c.fillStyle="rgba(0,0,0,.35)"; c.fillRect(ox-T*0.36+4,oy-T*1.0+5,T*0.72,T*1.0);
    c.fillStyle="#24231F"; c.fillRect(ox-T*0.36,oy-T*1.0,T*0.72,T*1.0);
    c.fillStyle="#C98A1B"; c.fillRect(ox-T*0.36,oy-T*1.0,T*0.72,T*0.09);
    for(let r=0;r<3;r++) for(let q=0;q<2;q++){ c.fillStyle=hsh(r,q,Math.floor(t*0.5))>0.3?"#F2D38A":"#4A4843"; c.fillRect(ox-T*0.24+q*T*0.26,oy-T*0.78+r*T*0.22,T*0.18,T*0.13); }
    c.fillStyle="#1B1A17"; c.font=`800 ${T*0.16}px ${F}`; c.textAlign="center"; c.fillText("MANUFAKTUR",ox,oy+T*0.18); }
}
function fwSheet(){ reopen=fwSheet;
  const zeile=m=>{ const habe=(S.fin[m]||0)+(S.fin[m+"_s"]||0), will=FW_NEED[m], ok=habe>=will;
    return `<div class="opt ${ok?"":""}"><div><b>${MODELS[m].n}</b><span>${S.open[m]?(ok?"reicht":"fehlen noch "+(will-habe)):"noch nicht entworfen, kostet "+MODELS[m].unlock}</span></div>
      <em style="color:${ok?"var(--money)":"var(--bad)"}">${habe} von ${will}</em></div>`; };
  const fehlt=Object.keys(FW_NEED).filter(m=>!S.open[m]||((S.fin[m]||0)+(S.fin[m+"_s"]||0))<FW_NEED[m]);
  openSheet(`<h3>Fashion Week</h3><p>Eine Bestellung über 30 Runner, 20 Court und 10 Hightop, zu liefern in <b>fünf Minuten</b>. Was fertig ist, geht zuerst an die Bestellung. Die Banden greifen in dieser Zeit doppelt so oft an.</p>
    ${Object.keys(FW_NEED).map(zeile).join("")}
    ${fehlt.length?`<p style="color:var(--bad);font-weight:700">Dein Lager reicht noch nicht. Die fünf Minuten laufen ab dem Start, also produzier erst vor.</p>`:`<p style="color:var(--money);font-weight:700">Dein Lager reicht. Mit einem Tipp ist die Bestellung sofort komplett.</p>`}
    <div class="opt" data-fw="1"><div><b>Jetzt starten</b><span>Fünf Minuten, ab sofort.</span></div><em>los</em></div>`,
    ()=>{ const b=document.querySelector("[data-fw]"); if(b) b.onclick=()=>{ $("sheet").innerHTML=""; fwStart(); }; });
}
function zoneTap(){ const st=zoneState();
  if(S.exited&&!S.uhr) return grundstueckSheet();
  if(st==="ready") return fwSheet();
  if(st==="offer") return exitOffer();
  else if(st==="open") openSheet(`<h3>Kapitel 2</h3><p>Deine Uhrenmanufaktur steht oben. Oben im Turm wechselst du zwischen Sohle und Uhren.</p>`);
  else if(st==="locked") openSheet(`<h3>Gesperrtes Gebiet</h3><p>Hinter der Absperrung liegt das nächste Viertel. Bring <b>${FW_FORSCHUNGEN} Forschungen</b> zu Ende (${resFertig()} davon stehen), dann wartet hier die <b>Fashion Week</b>: eine riesige Bestellung in fünf Minuten. Wer sie liefert, bekommt ein Angebot für seine Firma und kann hier neu anfangen.</p>
    ${testModus()?`<div class="opt" data-test="1"><div><b>Zum Ausprobieren: Kapitel 2 aufmachen</b><span>Überspringt Forschung, Fashion Week und Exit. Nur zum Testen, fliegt später raus.</span></div><em></em></div>`:""}`,
    ()=>{ const b=document.querySelector("[data-test]"); if(b) b.onclick=()=>{ testSprungKapitel2(); }; });
}
