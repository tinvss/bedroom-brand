<script>
// Tutorial, Hinweise zur richtigen Zeit, Erklärfenster
function once(key,title,html){ if(S.seen[key]) return; if(tutOn&&key==="empty") return;
  const urgent = key==="fac"||key==="raid"||key==="fwgo"||key==="ch2"||key.startsWith("fwlost");
  const tooSoon = !urgent && S.t-(S.lastExplain??-99)<25;
  if(!urgent && ((tutOn&&tutI<TUT.length) || tooSoon)){ S.defer=S.defer||[]; if(!S.defer.some(d=>d.key===key)) S.defer.push({key,title,html}); return; }
  S.lastExplain=S.t;
  if(key==="fac"){ html=`<div class="confetti">${Array.from({length:28},(_,i)=>`<i style="left:${(i*37)%100}%;background:${["#E4572E","#2E6FE4","#1F9E6E","#F2B441","#7B5BC0"][i%5]};animation-delay:${(i%7)*0.12}s;animation-duration:${1.6+(i%5)*0.25}s"></i>`).join("")}</div>`+html; } S.seen[key]=true; paused=true; setPauseUI();
  $("overlay").innerHTML=`<div class="over"><div class="box"><h2>${title}</h2>${html}<button id="ok">Weiter</button></div></div>`;
  $("ok").onclick=()=>{ $("overlay").innerHTML=""; paused=false; setPauseUI(); }; }

/* ================= Tutorial ================= */
let tutOn=false, tutI=0, tutScrolled=-1, tutQ=[], tutSheetScrolled=null;
const hasM=t=>S.floors.some(F=>F.slots.some(m=>m&&m.t===t));
const emptySlot=pref=>{ const F=S.floors[0]; if(!F.slots[pref]) return [0,pref]; const i=F.slots.findIndex(x=>!x); return i<0?null:[0,i]; };
const TUT=[
 {t:"Tipp auf Nähen. Sechs Stiche ergeben ein Paar Runner.", view:"turm", el:()=>$("sew"), done:()=>S.sold+S.fin.runner>=1},
 {t:"Dein Laden zuhause verkauft fertige Paare von selbst. Näh weiter, bis du 100 Geld hast.", view:"turm", el:()=>$("sew"), done:()=>S.money>=100||hasM("bench"), prog:()=>Math.round(S.money)+" von 100"},
 {t:"Tipp auf einen freien Platz im Kinderzimmer.", optT:"Nimm die Werkbank mit Mitarbeiter. Er näht ab jetzt für dich.", view:"turm", tower:()=>emptySlot(3), opt:'[data-b="bench"]', done:()=>hasM("bench")},
 {t:"Er ist noch langsam. Tipp auf deinen Mitarbeiter.", optT:"Bild ihn aus. Dann näht er fast doppelt so schnell, und das Geld hast du schnell wieder drin.", view:"turm",
   tower:()=>findM(m=>m.t==="bench"), opt:"[data-tr]", done:()=>{ const b=findM(m=>m.t==="bench"); return !b||(S.floors[b[0]].slots[b[1]].lvl||0)>=1; },
   prog:()=>S.money<60?Math.round(S.money)+" von 60 Geld":""},
 {t:"Tipp auf die Gerberei. Von dort holst du Leder.", optT:"Bau eine Route. Ein Transporter fährt dann Leder in dein Lager.", view:"stadt", city:()=>S.sources[0], opt:"[data-go]", done:()=>S.sources[0].trucks>0, prog:()=>S.money<routeCost(S.sources[0])?Math.round(S.money)+" von "+routeCost(S.sources[0])+" Geld, dein Mitarbeiter verdient es gerade":""},
 {t:"Jetzt das Gummiwerk auf der anderen Seite.", optT:"Auch hier eine Route bauen.", view:"stadt", city:()=>S.sources[1], opt:"[data-go]", done:()=>S.sources[1].trucks>0, prog:()=>S.money<routeCost(S.sources[1])?Math.round(S.money)+" von "+routeCost(S.sources[1])+" Geld":""},
 {t:"Oben siehst du deinen Fuhrpark. Jeder Transporter kostet laufend. Ist dein Lager voll, bleiben sie stehen.", view:"stadt", el:()=>$("fleet"), info:true},
 {t:"Ab 15 verkauften Paaren wird aus dem Kinderzimmer eine Werkstatt. Hier siehst du, wie weit du bist.", view:"turm", el:()=>$("pairs"), done:()=>S.factory, prog:()=>S.sold+" von 15"},
 {t:"Die Werkstatt ist offen. Tipp auf einen Platz ganz links.", optT:"Nimm einen Zuschnitt. Er macht aus Leder Schäfte.", view:"turm", tower:()=>emptySlot(0), opt:'[data-b="cut"]', done:()=>hasM("cut")},
 {t:"Daneben eine Presse.", optT:"Die Presse macht aus Gummi Sohlen.", view:"turm", tower:()=>emptySlot(1), opt:'[data-b="press"]', done:()=>hasM("press")},
 {t:"Die Ware läuft nach rechts. Die Montage muss also rechts von Zuschnitt und Presse stehen.", optT:"Nimm die Montage. Sie baut aus Schaft und Sohle einen Sneaker.", view:"turm", tower:()=>emptySlot(2), opt:'[data-b="asm"]', done:()=>hasM("asm")},
 {t:"Bald kommen Banden. Deine Wachleute brauchen Ausrüstung. Stell einen Ausrüster auf.", optT:"Der Ausrüster macht aus Metall und Gummi Ausrüstung.", view:"turm", tower:()=>emptySlot(6), opt:'[data-b="equip"]', done:()=>hasM("equip")},
 {t:"Der Ausrüster braucht Metall. Tipp auf den Metallhof in der Mitte der Stadt.", optT:"Route bauen.", view:"stadt", city:()=>S.sources[4], opt:"[data-go]", done:()=>S.sources[4].trucks>0, prog:()=>S.money<routeCost(S.sources[4])?Math.round(S.money)+" von "+routeCost(S.sources[4])+" Geld":""},
 {t:"Der grüne Kreis ist dein Versorgungsgebiet. Tipp auf ein freies Feld darin.", optT:"Bau einen Wachposten. Hier wird er direkt aus dem Turm nachgefüllt. Posten weiter draußen, an deinen Routen, halten die Diebe früher auf, brauchen aber Versorgungswagen.", view:"stadt", city:()=>({x:5.5,y:10.5}), opt:"[data-go]", done:()=>S.posts.length>0},
 {t:"Ab hier bist du dran. Posten außerhalb des Kreises brauchen Versorgungswagen, die gibt es im Fuhrpark. Gegen Fälscher hilft ein Siegel hinter der Montage.", info:true, last:true}
];
function rectOf(st){
  if(st.el){ const e=st.el(); if(!e) return null; const r=e.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; }
  if(st.tower){ const t=st.tower(); if(!t) return null; const r=tcv.getBoundingClientRect(), n=aktivesWerk().floors.length, nextH=S.factory&&etagenPreis(n)!==undefined?60:0;
    const Y=ROOF+nextH+(n-1-t[0])*FH, laneY=Y+BAND_Y; return {x:r.left+(X0+t[1]*SLW)*TS, y:r.top+(laneY-76)*TS, w:SLW*TS, h:84*TS}; }
  if(st.tw){ const q=st.tw(); if(!q) return null; const r=tcv.getBoundingClientRect(); return {x:r.left+q.x*TS, y:r.top+q.y*TS, w:q.w*TS, h:q.h*TS}; }
  if(st.zone){ const r=cv.getBoundingClientRect(); return {x:r.left+4, y:r.top+4, w:W*T-8, h:TOPR()*T-8}; }
  if(st.city){ const p=st.city(), r=cv.getBoundingClientRect(), rad=0.62; return {x:r.left+(p.x-rad)*T, y:r.top+(p.y+TOPR()-rad)*T, w:2*rad*T, h:2*rad*T}; }
  return null;
}
function tutUpdate(){
  const ring=$("tutRing"), box=$("tutBox");
  if(!tutOn||$("overlay").innerHTML){ ring.style.display="none"; box.style.display="none"; return; }
  while(tutQ.length&&tutQ[0].done&&tutQ[0].done()) tutQ.shift();
  let st=tutQ[0];
  if(!st){ st=TUT[tutI]; while(st&&st.done&&st.done()){ tutI++; st=TUT[tutI]; } }
  if(!st){ if(tutI>=TUT.length&&!S.tutDone){ S.tutDone=true; S.lastExplain=S.t; } tutOn=false; ring.style.display="none"; box.style.display="none"; return; }
  const fromQ=st===tutQ[0], stepKey=fromQ?"q"+st.id:tutI;
  let text=st.t, r=null;
  const sheetOpen=!!$("sheet").innerHTML;
  if(st.view&&view!==st.view&&!sheetOpen){ const tab=st.view==="stadt"?$("tStadt"):$("tTurm"); const b=tab.getBoundingClientRect(); r={x:b.left,y:b.top,w:b.width,h:b.height};
    text=(st.view==="stadt"?"Wechsel zur Stadt. ":"Wechsel zum Turm. ")+st.t; }
  else if(sheetOpen){ const o=st.opt&&document.querySelector(st.opt);
    if(o){ if(tutSheetScrolled!==stepKey){ tutSheetScrolled=stepKey; o.scrollIntoView({block:"nearest"}); }
      const b=o.getBoundingClientRect(); r={x:b.left,y:b.top,w:b.width,h:b.height}; text=st.optT||st.t; }
    else if(st.opt){ const off=[...document.querySelectorAll("#sheet .opt.off")].find(e=>st.optT&&e.textContent.includes((st.optT.match(/(Labor|Zuschnitt|Presse|Montage|Ausrüster|Werkbank|Route|Posten|Runner|Court|Hightop)/)||[])[1]||"@@"));
      const locked=off&&/Erst /.test(off.textContent);
      const c=$("cl"); if(c){ const b=c.getBoundingClientRect(); r={x:b.left,y:b.top,w:b.width,h:b.height}; }
      text=locked?"Das ist noch gesperrt, darunter steht, ab wann es geht. Schließ das Fenster.":"Dafür reicht dein Geld noch nicht. Schließ das Fenster und warte kurz, deine Leute arbeiten weiter."; }
    else r=null; }
  else { r=rectOf(st);
    if(r&&tutScrolled!==stepKey&&(r.y+r.h<40||r.y>innerHeight-190)){ tutScrolled=stepKey; window.scrollBy({top:r.y-innerHeight*0.3,behavior:"smooth"}); } }
  if(r){ ring.style.display="block"; ring.style.left=(r.x+window.scrollX-6)+"px"; ring.style.top=(r.y+window.scrollY-6)+"px"; ring.style.width=(r.w+12)+"px"; ring.style.height=(r.h+12)+"px"; }
  else ring.style.display="none";
  const key=stepKey+"|"+text+"|"+(st.prog?st.prog():"");
  if(box.dataset.key!==key){ box.dataset.key=key;
    box.innerHTML=`<div class="st">${fromQ?"WAS GERADE PASSIERT IST":"SCHRITT "+(tutI+1)+" VON "+TUT.length}</div>${text}${st.prog?`<div style="color:#F2B441;font-weight:800;margin-top:4px">${st.prog()}</div>`:""}
      <div class="row"><a id="tutEnd">Tutorial beenden</a>${st.info?`<button id="tutNext">${st.last?"Los":"Weiter"}</button>`:""}</div>`;
    $("tutEnd").onclick=()=>{ tutOn=false; tutQ=[]; S.tutDone=true; if(S.tapPause||S.alarmPause){ S.tapPause=false; S.alarmPause=false; paused=false; setPauseUI(); } tutUpdate(); };
    if($("tutNext")) $("tutNext").onclick=()=>{ if(fromQ){ const q=tutQ.shift(); if(q&&q.onNext) q.onNext(); } else tutI++; box.dataset.key=""; tutUpdate(); }; }
  box.style.display="block";
  if(sheetOpen){ box.style.top="calc(12px + env(safe-area-inset-top,0px))"; box.style.bottom="auto"; return; }
  const below = !r || r.y+r.h+170 < innerHeight;
  box.style.top = below ? ((r?r.y+r.h+14:innerHeight-190))+"px" : "auto";
  box.style.bottom = below ? "auto" : (innerHeight-r.y+14)+"px";
}

const towerTop=f=>{ const n=aktivesWerk().floors.length, nextH=S.factory&&etagenPreis(n)!==undefined?60:0; return ROOF+nextH+(n-1-f)*FH; };
function liftRect(f){ if(!aktivesWerk().lifts[f]) return null; const sx=dirOf(f)===1?468:18, Yt=towerTop(f+1)+BAND_Y-20, Yb=towerTop(f)+(f>0?DURCH_Y+8:BAND_Y+14); return {x:sx-8,y:Yt,w:30,h:Yb-Yt}; }
function bandRect(f){ if(!aktivesWerk().floors[f]) return null; const laneY=towerTop(f)+BAND_Y; return {x:X0-6,y:laneY-12,w:SLW*L+12,h:(DURCH_Y-BAND_Y)+24}; }
function doorRect(f){ if(!aktivesWerk().floors[f]) return null; const side=dirOf(f)===1?18:472, laneY=towerTop(f)+BAND_Y; return {x:side-10,y:laneY-80,w:30,h:40}; }
function hint(key,steps,force){ if(S.seen[key]) return; if(!S.tutDone&&tutOn&&tutI<TUT.length&&!force) return; if(!force&&(S.t-(S.lastExplain??-99)<25||$("overlay").innerHTML)) return; S.lastExplain=S.t; S.seen[key]=true; if(!tutOn) tutI=TUT.length; tutOn=true; switchView(steps[0].view||"turm"); tutQ.push(...steps); }
function robGuide(p,src){
  const nPosts=S.posts.length, name=src.k==="leder"?"Leder":src.k==="gummi"?"Gummi":"Metall";
  // Vorschlag: ein freies Feld an dieser Route, möglichst im grünen Kreis
  const path=pathOf(src); let spot=null;
  for(let k=0;k<=20&&!spot;k++){ const q=pointAt(path,pathLen(path)*(1-k/20)); const c={x:Math.floor(q.x)+1.5,y:Math.floor(q.y)+0.5};
    if(dist(c,HQ)<=SUPPLY_R&&dist(c,HQ)>0.9) spot=c; }
  spot=spot||{x:HQ.x+1,y:HQ.y-1.5};
  paused=true; setPauseUI(); if(!tutOn) tutI=TUT.length; tutOn=true; switchView("stadt");
  tutQ.push({id:1, view:"stadt", city:()=>p, info:true, t:`Überfall. Dein ${name}transporter wurde ausgeraubt, die Ladung ist weg. Deshalb fehlt gleich ${name} im Lager, und die Maschinen, die ${name} brauchen, stehen still.`, onNext:()=>{ paused=false; setPauseUI(); }},
    {id:2, view:"stadt", city:()=>spot, opt:"[data-go]", t:"So schützt du die Route: Tipp auf dieses Feld an der Straße.", optT:"Bau einen Wachposten. Er fängt Räuber in seiner Nähe, bevor sie deine Transporter erreichen.", done:()=>S.posts.length>nPosts,
     prog:()=>S.money<postCost()?Math.round(S.money)+" von "+postCost()+" Geld":""},
    {id:3, view:"stadt", city:()=>S.posts[S.posts.length-1]||spot, info:true, t:"Der gelbe Balken am Posten ist sein Vorrat. Im grünen Kreis füllt der Turm ihn von selbst auf. Außerhalb braucht er Versorgungswagen."});
}

function shopHint(){ if(S.seen.shopHint||!S.tutDone) return; const fin=Object.values(S.fin).reduce((a,b)=>a+b,0);
  const freeD=S.districts.find(d=>!d.shop&&d.nest===undefined&&d.n!=="Zuhause");
  if(fin>=12&&freeD) hint("shopHint",[{id:"sh1", view:"stadt", city:()=>freeD, info:true,
    t:`Du stellst mehr Schuhe her, als dein Laden verkaufen kann. Ein Laden in der ${freeD.n} verkauft zusätzlich, und jeder Laden hat seine eigenen Kunden, die Preise fallen dort also getrennt. Tipp auf das Viertel.`}]); }
function intakeHint(){ if(!S.tutDone||S.seen.intakeUp||S.floors.length<3||((S.intakeLvl||{})[0]||0)>0) return;
  hint("intakeUp",[{id:"iu1", view:"turm", tw:()=>doorRect(0), info:true,
    t:"Das ist deine Warenannahme im Erdgeschoss. Sie legt die Rohstoffe aufs Band. Tipp sie an und bau sie aus: Dann liefert sie doppelt so schnell, direkt in die Maschinen."}]); }
function fwHint(){ if(S.seen.fwHint||!fwOffen()||S.fw) return;
  hint("fwHint",[{id:"fw1", view:"stadt", zone:true, info:true, t:"Fünf Forschungen stehen. Die Absperrung oben in der Stadt ist offen: Dort wartet die Fashion Week, fünf Minuten, eine riesige Bestellung aus allen drei Modellen. Produzier vorher Court und Hightop auf Vorrat, dann tipp auf das Viertel."}],true); }
function marketHint(){ if(S.seen.mktHint||!S.factory||!S.tutDone) return; const home=S.districts[0];
  if(priceIn(home,"runner")<MODELS.runner.p0*0.8) hint("mktHint",[{id:"mk1", view:"turm", el:()=>document.querySelector(".mk .m"), info:true,
    t:"Schau auf den Runner-Preis: Je mehr du vom selben Modell verkaufst, desto weniger zahlen die Leute. Wer alles hat, will nicht noch einen. Ein zweites Modell, der Court, bringt dir dann mehr als noch mehr Runner."}]); }

function guide(target,text){ $("sheet").innerHTML=""; if(!tutOn) tutI=TUT.length; tutOn=true; switchView("turm");
  tutQ.push(Object.assign({id:"g"+Math.round(S.t*10), info:!target.done, t:text, view:"turm"},target)); }

function releaseDeferred(){ if(!S.defer||!S.defer.length||$("overlay").innerHTML||(tutOn&&(tutQ.length||tutI<TUT.length))) return;
  if(S.t-(S.lastExplain??-99)<25) return; const d=S.defer.shift(); once(d.key,d.title,d.html); }

<script>
// Menüs im Turm: Platz, Maschine, Warenannahme, Etage, Aufzug
/* ================= Eingaben: Turm ================= */
let reopen=null, sheetGeld=0, sheetT=0;
// Ein offenes Fenster baut sich nur neu auf, wenn es dort etwas Gesperrtes gibt und das Geld
// inzwischen reicht. Sonst würde es dauernd neu zeichnen und Tipps verschlucken.
function sheetAuffrischen(dt){ if(!S||!reopen||!$("sheet").innerHTML) return;
  sheetT+=dt; if(sheetT<1) return; sheetT=0;
  if(S.money<=sheetGeld) { sheetGeld=Math.min(sheetGeld,S.money); return; }
  const gesperrt=[...document.querySelectorAll("#sheet .opt.off, #sheet button:disabled")];
  if(!gesperrt.length){ sheetGeld=S.money; return; }
  // Die Scrollstelle merken, sonst springt ein langes Fenster wie der Fuhrpark bei jedem Aufbau nach oben
  const box=document.querySelector("#sheet .in"), pos=box?box.scrollTop:0;
  reopen();
  const neu=document.querySelector("#sheet .in"); if(neu&&pos) neu.scrollTop=pos; }
function openSheet(html,bind){ $("sheet").innerHTML=`<div class="sheet"><div class="in">${html}<button class="close" id="cl">Schließen</button></div></div>`;
  $("cl").onclick=()=>{ $("sheet").innerHTML=""; reopen=null; }; bind&&bind();
  // Tipp neben das Fenster schließt es auch. Katya hat genau das versucht.
  const hg=document.querySelector("#sheet .sheet");
  if(hg) hg.onclick=e=>{ if(e.target===hg){ $("sheet").innerHTML=""; reopen=null; } };
  sheetGeld=S?S.money:0;
  document.querySelectorAll("#sheet .opt.off").forEach((el,_,all)=>el.onclick=()=>{ if(!reopen) return;
    const idx=[...document.querySelectorAll("#sheet .opt")].indexOf(el); reopen();
    const el2=document.querySelectorAll("#sheet .opt")[idx]; if(el2&&!el2.classList.contains("off")) el2.click(); }); }
// Großprojekte kosten nicht fix, sondern so viel wie 20 Minuten Umsatz
const machPreis=(W,k)=>W.mach[k].gross?ratePreis():W.mach[k].cost;
let moving=null;
function openSlot(f,i){ const W=aktivesWerk(); if(!W||!W.floors[f]) return;   // Etage gibt es in diesem Haus nicht
  if(!moving) reopen=()=>openSlot(f,i);
  if(moving){ const a=moving; moving=null; if(a.haus!==aktivesHaus().id||!W.floors[a.f]) return;   // nur innerhalb eines Hauses verschieben
    const A=W.floors[a.f].slots,B=W.floors[f].slots,t=B[i]; B[i]=A[a.i]; A[a.i]=t; return; }
  const m=W.floors[f].slots[i];
  if(!m){
    if(W.name==="sohle"&&S.uhr){ openSheet(`<h3>Sohle ist fertig gebaut</h3><p>Seit dem Einstieg der Investorin baust du hier nichts Neues mehr. Was steht, läuft weiter: reparieren, Modelle umstellen, Maschinen verschieben und der Regler für die Lederbänder.</p><p>Neue Maschinen und Etagen gibt es oben in der Manufaktur.</p>`); return; }
    let h=`<h3>${f===0&&!S.factory?"Kinderzimmer":f+1+". Etage"}, Platz ${i+1}</h3><p>Die Ware läuft hier ${dirOf(f)===1?"nach rechts":"nach links"}.</p>`;
    for(const [k,M] of Object.entries(W.mach)){
      const grossZu=M.gross&&!werkstattKaufbar(), preis=machPreis(W,k);
      const locked=(M.factory&&!S.factory)||(k==="lab"&&W.floors.length<3)||grossZu, ok=!locked&&S.money>=preis;
      h+=`<div class="opt ${ok?"":"off"}" ${ok?`data-b="${k}"`:""}><div style="display:flex;gap:10px;align-items:center">${machIcon(k)}<div><b>${M.n}</b><span>${grossZu?werkstattGrund():locked?(k==="lab"&&S.factory?MACH_LOCK.lab:"Erst ab "+FACTORY_AT+" verkauften Paaren"):M.d}</span></div></div><em>${preis}</em></div>`; }
    openSheet(h,()=>document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ const k=b.dataset.b; S.money-=machPreis(W,k);
      W.floors[f].slots[i]={t:k,buf:{},busy:false,p:0,model:Object.keys(W.models)[0],lvl:0,born:S.t};
      if(k==="werkstatt") meisterStart();   // der Raum steht, der Auftrag liegt darin
      $("sheet").innerHTML=""; }));
    return; }
  if(m.t==="werkstatt"){ meisterSheet(); return; }   // die Werkstatt zeigt den Auftrag, nicht Puffer und Vorrang
  const M=W.mach[m.t];
  const nd=bedarfVon(W,m)||{}, fehlt=Object.keys(nd).filter(k=>(m.buf[k]||0)<nd[k]);
  // Einzahl und Mehrzahl, damit "1 Uhrwerke" nicht dasteht
  const TEILE={leder:["Leder","Leder"],gummi:["Gummi","Gummi"],metall:["Metall","Metall"],schaft:["Schaft","Schäfte"],sohle:["Sohle","Sohlen"],
    sand:["Sand","Sand"],band:["Lederband","Lederbänder"],gehaeuse:["Gehäuse","Gehäuse"],glas:["Glas","Glas"],zahnrad:["Zahnrad","Zahnräder"],
    uhrwerk:["Uhrwerk","Uhrwerke"],fertig:W.name==="uhren"?["fertige Uhr","fertige Uhren"]:["fertigen Schuh","fertige Schuhe"]};
  const teilName=(k,n)=>(TEILE[k]||[k,k])[n===1?0:1];
  const bufTxt=Object.entries(m.buf||{}).filter(([k,v])=>v>0).map(([k,v])=>v+" "+(W.models[k]?W.models[k].n:teilName(k,v))).join(", ");
  let h=`<h3>${M.n}</h3><p>${M.d}</p>`;
  if(m.out) h+=`<p style="color:var(--bad);font-weight:700;margin-top:-4px">Kommt nicht los: Das fertige Teil kann nicht aufs Band, davor ist alles voll.</p>`;
  else if(m.full) h+=`<p style="color:var(--ammo);font-weight:700;margin-top:-4px">Pausiert, das Ausrüstungslager ist voll.</p>`;
  else if(fehlt.length&&!m.busy) h+=`<p style="color:var(--bad);font-weight:700;margin-top:-4px">Es fehlt: ${fehlt.map(k=>(nd[k]>1?nd[k]+" ":"")+teilName(k,nd[k])).join(", ")}</p>`;
  h+=`<p style="margin-top:-6px">Hergestellt: <b>${m.made||0}</b>${bufTxt?" · im Puffer: "+bufTxt:" · Puffer leer"}${m.prio?" · hat Vorrang":""}</p>`;
  if(M.t&&M.t.length>1){ const nx=(m.lvl||0)+1, c=(M.up||[0,60,300])[nx];
    if(nx<M.t.length){ const ok=S.money>=c; h+=`<div class="opt ${ok?"":"off"}" ${ok?'data-tr="1"':""}><div><b>${m.t==="bench"?"Ausbilden":"Ausbauen"}</b><span>Braucht dann ${M.t[nx]} statt ${M.t[m.lvl||0]} Takte pro Stück.</span></div><em>${c}</em></div>`; }
    else h+=`<p><b>${m.t==="bench"?"Voll ausgebildet.":"Voll ausgebaut."}</b></p>`; }
  // Modellwahl bei jeder Maschine, die nach Modell baut: Montage in Sohle, Endmontage in der Manufaktur
  if(W.mach[m.t].need==="modell") for(const [k,Mo] of Object.entries(W.models)){ const ok=W.open?W.open[k]:S.open[k];
    const braucht=Object.entries(Mo.need).map(([t,n])=>n+" "+teilName(t,n)).join(", ");
    h+=`<div class="opt ${ok?"":"off"}" ${ok?`data-mo="${k}"`:""}><div><b>${Mo.n}${m.model===k?" · läuft":""}</b><span>${ok?"braucht "+braucht:"noch nicht entworfen"}</span></div><em>${ok?Mo.p0:Mo.unlock}</em></div>`; }
  // Regler für Lederbänder: nur in Sohle und erst, wenn es die Manufaktur gibt
  if(m.t==="cut"&&W.name==="sohle"&&S.uhr){ const a=Math.round((S.bandAnteil||0)*100);
    h+=`<p style="margin-top:2px"><b>Lederbänder für die Manufaktur:</b> ${a} % aller Zuschnitte. Der Rest bleibt Schäfte für Sneaker. Der Lieferwagen holt die Bänder unten ab.</p>
      <div style="display:flex;gap:6px;margin-bottom:8px">${[0,25,50,75,100].map(v=>`<button data-band="${v}" style="flex:1;appearance:none;font:inherit;font-weight:800;font-size:13px;padding:9px 0;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:${v===a?"var(--ink)":"var(--card)"};color:${v===a?"var(--card)":"var(--soft)"}">${v} %</button>`).join("")}</div>`; }
  if(Object.keys(bedarfVon(W,m)||{}).some(k=>W.lager[k]!==undefined)) h+=`<div class="opt" data-pr="1"><div><b>Vorrang ${m.prio?"aufheben":"geben"}</b><span>${m.prio?"Bekommt gerade doppelt so viel Material wie andere.":"Bekommt bei Knappheit doppelt so viel Material wie andere Maschinen."}</span></div><em>${m.prio?"an":""}</em></div>`;
  if(m.t==="lab"||m.t==="atelier") h+=`<div class="opt" data-fo="1"><div><b>Forschung öffnen</b><span>Hier wählst du, woran gearbeitet wird. Das läuft weiter, auch wenn du woanders bist.</span></div><em>›</em></div>`;
  h+=`<div class="opt" data-mv="1"><div><b>Verschieben</b><span>Danach auf einen Platz tippen, auch auf einer anderen Etage.</span></div><em></em></div>`;
  h+=`<div class="opt" data-se="1"><div><b>Abbauen</b><span>Du bekommst alles zurück.</span></div><em>+${M.cost}</em></div>`;
  openSheet(h,()=>{
    const tr=document.querySelector("[data-tr]"); if(tr) tr.onclick=()=>{ const c=(M.up||[0,60,300])[(m.lvl||0)+1]; if(S.money<c) return; S.money-=c; m.lvl=(m.lvl||0)+1; $("sheet").innerHTML=""; };
    document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{ m.model=b.dataset.mo; m.buf={}; m.busy=false; $("sheet").innerHTML=""; });
    const fo=document.querySelector("[data-fo]"); if(fo) fo.onclick=()=>{ $("sheet").innerHTML=""; $("tForsch").onclick(); };
    document.querySelector("[data-mv]").onclick=()=>{ moving={f,i,haus:aktivesHaus().id}; $("sheet").innerHTML=""; };
    const pr=document.querySelector("[data-pr]"); if(pr) pr.onclick=()=>{ m.prio=!m.prio; $("sheet").innerHTML=""; };
    document.querySelectorAll("[data-band]").forEach(b=>b.onclick=()=>{ S.bandAnteil=+b.dataset.band/100; openSlot(f,i); });
    document.querySelector("[data-se]").onclick=()=>{ S.money+=M.cost; W.floors[f].slots[i]=null; $("sheet").innerHTML=""; };
  });
}

function openIntake(f){ const W=aktivesWerk(); if(!W||!W.floors[f]) return;
  reopen=()=>openIntake(f);
  if(W.name==="sohle"&&S.uhr&&!W.intakes.includes(f)){ openSheet(`<h3>Sohle ist fertig gebaut</h3><p>Hier kommt nichts Neues mehr dazu. Neue Annahmen baust du oben in der Manufaktur.</p>`); return; }
  const has=W.intakes.includes(f), c=INTAKE_COST[f]||4000, ok=S.money>=c;
  const nextI=W.intakes.filter(x=>x>f).sort((a,b)=>a-b)[0]??W.floors.length;
  const rawUsers=W.floors.slice(f,nextI).some(F=>F.slots.some(m=>m&&["bench","cut","press","equip"].includes(m.t)));
  const lvl=(W.intakeLvl||{})[f]||0, upC=[350,900][lvl]||0;
  openSheet(`<h3>Warenannahme${has?" · Stufe "+(lvl+1):" bauen"}</h3><p>${has?"Hier kommt Material aus dem Lager, "+(lvl===0?"ein Teil alle zwei Takte":lvl===1?"ein Teil pro Takt":"zwei Teile pro Takt")+(f>0||lvl>0?", direkt in die Maschine, die es braucht.":", am Anfang des Bandes.")+"  Sie beliefert diese Etage und alle darüber, bis zur nächsten Annahme.":"Bisher kommt alles Material für diese Etage unten rein und muss mit dem Aufzug hoch. Eine eigene Annahme liefert direkt hierher und verdoppelt, was dein Haus aufnehmen kann."}</p>
    <p><b>Wichtig:</b> Eine Annahme bringt nur Rohstoffe, also Leder, Gummi und Metall. Sie lohnt sich nur, wenn auf dieser Etage Zuschnitt, Presse oder Ausrüster stehen. Montagen und Siegel bekommen ihre Teile immer über den Aufzug.</p>
    ${rawUsers?"":`<p style="color:var(--bad);font-weight:700">Hier steht gerade nichts, was Rohstoffe braucht. Eine Annahme würde nichts liefern.</p>`}
    ${has?"":`<div class="opt ${ok?"":"off"}" ${ok?'data-go="1"':""}><div><b>Annahme einbauen</b><span></span></div><em>${c}</em></div>`}
    ${has&&lvl<2?`<div class="opt ${S.money>=upC?"":"off"}" ${S.money>=upC?'data-up="1"':""}><div><b>Annahme ausbauen</b><span>${lvl===0?(f===0?"Liefert doppelt so oft und direkt in die Maschinen, statt alles am Bandanfang einzuspeisen.":"Liefert doppelt so oft."):"Liefert noch einmal doppelt so schnell."}</span></div><em>${upC}</em></div>`:""}
    ${has&&lvl>=2?`<p><b>Voll ausgebaut.</b></p>`:""}`,
    ()=>{ const b=document.querySelector("[data-go]"); if(b) b.onclick=()=>{ S.money-=c; W.intakes.push(f); $("sheet").innerHTML=""; };
      const u=document.querySelector("[data-up]"); if(u) u.onclick=()=>{ S.money-=upC; W.intakeLvl[f]=lvl+1; $("sheet").innerHTML=""; }; });
}
function buildFloor(){ const W=aktivesWerk(), n=W.floors.length, c=etagenPreis(n); if(!S.factory||c===undefined||S.money<c) return;
  S.money-=c; W.floors.push({lane:new Array(L).fill(null), slots:new Array(L).fill(null)}); W.lifts.push({q:[],c:0,lvl:0});
  if(W.floors.length===2) hint("doorHint",[{id:12, tw:()=>doorRect(1), info:true, t:"Neue Etagen bekommen ihr Material über den Aufzug von unten. Hier an der Wand kannst du eine eigene Warenannahme einbauen, dann kommt es direkt auf diese Etage. Das lohnt sich, wenn diese Etage eine eigene komplette Straße bekommt: Zuschnitt, Presse und Montage."}]); }
// Ein Satz zur Weiche oben am Aufzug, mit der letzten Entscheidung und ihrem Grund
const teilName=(W,k)=> k.endsWith("_s")?"beglaubigte "+W.models[k.slice(0,-2)].n : W.models[k]?W.models[k].n : {leder:"Leder",gummi:"Gummi",metall:"Metall",schaft:"Schaft",sohle:"Sohle",ausr:"Ausrüstung"}[k]||k;
function weicheText(W,up){ let t="Oben sitzt eine Weiche. Was eine Maschine auf der nächsten Etage verarbeiten kann, kommt aufs obere Band zu den Maschinen. Alles andere fährt auf dem Durchgangsband darunter vorbei.";
  const w=up&&up.weiche; if(!w) return t;
  const n=teilName(W,w.k), m=w.m&&W.mach[w.m].n;
  return t+" <b>Zuletzt: "+n+(w.band==="oben" ? " aufs obere Band, dort steht ein"+(w.m==="press"||w.m==="bench"||w.m==="asm"?"e ":" ")+m+"."
    : m ? " aufs Durchgangsband, vorne auf dem oberen Band war kein Platz." : " aufs Durchgangsband, dort verarbeitet niemand "+n+".")+"</b>"; }
function openLift(f){ const W=aktivesWerk(); if(!W||!W.lifts[f]) return;
  reopen=()=>openLift(f); const Lf=W.lifts[f], nx=Lf.lvl+1;
  let h=`<h3>Aufzug</h3><p>Eine Ladung alle ${LIFT_SPEED[Lf.lvl]} Takte.</p><p>${weicheText(W,W.floors[f+1])}</p>`;
  if(nx<LIFT_SPEED.length){ const c=LIFT_UP[nx], ok=S.money>=c; h+=`<div class="opt ${ok?"":"off"}" ${ok?'data-lu="1"':""}><div><b>Schneller</b><span>Alle ${LIFT_SPEED[nx]} Takte.</span></div><em>${c}</em></div>`; }
  openSheet(h,()=>{ const b=document.querySelector("[data-lu]"); if(b) b.onclick=()=>{ S.money-=LIFT_UP[nx]; Lf.lvl=nx; $("sheet").innerHTML=""; }; }); }
</script>
<script>
// Menüs in der Stadt: Tippen auf die Karte, Fuhrpark
/* ================= Eingaben: Stadt ================= */
function cityTap(x,y){
  const rd=S.raiders.filter(r=>dist(r,{x,y})<0.85).sort((a,b)=>dist(a,{x,y})-dist(b,{x,y}))[0];
  if(rd){ const beimTrupp=S.squads.some(q=>dist(q,rd)<2.2);   // während einer Razzia deckst du deinen Trupp
    const nah = dist(rd,HQ)<=SUPPLY_R+0.3 || (S.uhr&&S.uhr.ort&&dist(rd,S.uhr.ort)<=SUPPLY_R+0.3);
    if(!nah&&!beimTrupp){ pop(rd,"zu weit weg","#B8432F"); return; }
    if(S.t<(S.handCd||0)){ pop(HQ,"Netz lädt nach","#7A7366"); return; }
    S.handCd=S.t+0.6; rd.hp-=4; rd.hitT=S.t; S.seen.tapped=true; for(const o of S.raiders) if(o!==rd&&dist(o,rd)<0.8){ o.hp-=2; o.hitT=S.t; }
    if(S.tapPause){ S.tapPause=false; paused=false; setPauseUI(); }
    const von=beimTrupp?S.squads.slice().sort((a,b)=>dist(a,rd)-dist(b,rd))[0]:{x:HQ.x,y:HQ.y-0.4};
    S.shots.push({a:{x:von.x,y:von.y},b:{x:rd.x,y:rd.y},ttl:0.25,max:0.25}); return; }
  const src=S.sources.find(s=>dist(s,{x,y})<0.85);
  if(src){ const has=src.trucks>0, full=fleetUsed()>=S.fleet, c=has?90:routeCost(src), ok=!full&&S.money>=c;
    const fc=fleetCost(), fok=S.money>=fc;
    const zielZeile = S.uhr ? (src.k==="metall"
      ? `<p><b>Liefert an:</b></p><div style="display:flex;gap:6px;margin-bottom:8px">${[["sohle","Sohle"],["uhren","Manufaktur"]].map(([id,n])=>`<button data-zl="${id}" style="flex:1;appearance:none;font:inherit;font-weight:800;font-size:13px;padding:9px 0;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:${zielVon(src)===id?"var(--ink)":"var(--card)"};color:${zielVon(src)===id?"var(--card)":"var(--soft)"}">${n}</button>`).join("")}</div>`
      : `<p>Liefert an <b>${zielName(src)}</b>. ${src.k==="sand"?"Sand braucht nur die Manufaktur.":"Leder und Gummi braucht nur Sohle."}</p>`) : "";
    openSheet(`<h3>${src.n||RAW[src.k].n}</h3>${zielZeile}<p>${has?src.trucks+" Transporter fahren hier.":"Noch keine Route."} Dein Fuhrpark: ${S.trucks.length} von ${S.fleet}. Jeder Transporter kostet laufend Fahrer und Sprit.</p>
      <div class="opt ${ok?"":"off"}" ${ok?'data-go="1"':""}><div><b>${has?"Noch ein Transporter":"Route bauen"}</b><span>${full?"Fuhrpark ist voll.":"Liefert in dein Lager."}</span></div><em>${c}</em></div>
      <div class="opt ${fok?"":"off"}" ${fok?'data-fl="1"':""}><div><b>Fuhrpark vergrößern</b><span>Platz für einen Transporter mehr.</span></div><em>${fc}</em></div>`,
      ()=>{ const b=document.querySelector("[data-go]"); if(b) b.onclick=()=>{ S.money-=c; addTruck(src); $("sheet").innerHTML=""; };
        document.querySelectorAll("[data-zl]").forEach(z=>z.onclick=()=>{ src.ziel=z.dataset.zl;
          const i2=S.sources.indexOf(src), p2=pathOf(src);
          S.trucks.forEach(t=>{ if(t.src===i2){ t.path=p2; t.d=0; t.dir=-1; t.cargo=0; t.pos={...p2[0]}; } });
          cityTap(x,y); });
        const f=document.querySelector("[data-fl]"); if(f) f.onclick=()=>{ S.money-=fc; S.fleet++; $("sheet").innerHTML=""; }; });
    return; }
  if(!S.movePost) reopen=()=>cityTap(x,y);
  if(S.uhr&&S.uhr.ort&&dist({x,y},S.uhr.ort)<0.9){ S.haus="uhren"; switchView("turm"); return; }
  if(dist({x,y},HQ)<0.9){ S.haus="sohle"; switchView("turm"); return; }
  const fk=S.fakes.find(f=>dist(f,{x,y})<0.45);
  if(fk){ const c=sueCost(), ok=S.money>=c;
    openSheet(`<h3>Fälscherbude</h3><p>Verkauft gefälschte ${MODELS[fk.m].n} in ${fk.d.n}. Stärke ${fk.str.toFixed(1)}. Eine Abmahnung schließt sie sofort.</p>
      <div class="opt ${ok?"":"off"}" ${ok?'data-go="1"':""}><div><b>Abmahnen</b><span>Jedes Mal etwas teurer.</span></div><em>${c}</em></div>`,
      ()=>{ const b=document.querySelector("[data-go]"); if(b) b.onclick=()=>{ S.money-=c; S.sues++; S.fakes=S.fakes.filter(g=>g!==fk); pop(fk,"ABGEMAHNT","#1F7A55"); $("sheet").innerHTML=""; }; });
    return; }
  const nest=S.nests.find(n=>n.alive&&dist(n,{x,y})<0.8);
  // Netzwerfer auf dem Dach der Manufaktur: Netz im Bogen auf ein Versteck in Reichweite
  if(nest&&RES2().werfer&&S.uhr.ort&&dist(nest,S.uhr.ort)<=werferWeite()&&!S.squads.some(q=>S.nests[q.nest]===nest)){
    if(S.t<(S.werferCd||0)){ pop(nest,"Netzwerfer lädt","#7A7366"); return; }
    if(S.ammo<5){ pop(nest,"zu wenig Ausrüstung","#B8432F"); return; }
    S.werferCd=S.t+1.2; S.ammo-=5; stat("ammoUse",5); nest.hp-=12; nest.hitT=S.t;
    S.shots.push({a:{x:S.uhr.ort.x,y:S.uhr.ort.y},b:{x:nest.x,y:nest.y},ttl:0.35,max:0.35});
    if(nest.hp<=0){ nest.alive=false; S.cleared++; S.lastClear=S.t; const dd=S.districts[nest.district]; if(dd) delete dd.nest; pop(nest,"AUSGEHOBEN","#1F7A55"); beuteZurueck(nest); }
    return; }
  if(nest){ const laeuft=S.squads.filter(q=>S.nests[q.nest]===nest&&!q.back);
    if(laeuft.length){   // Während der Razzia hilfst du selbst: Netz aus dem Turm auf das Versteck
      if(S.t<(S.handCd||0)){ pop(nest,"Netz lädt nach","#7A7366"); return; }
      S.handCd=S.t+0.6; nest.hp-=4; nest.hitT=S.t;   // aus dem Turm geworfen, kostet nichts, wie bei Dieben
      S.shots.push({a:{x:HQ.x,y:HQ.y-0.4},b:{x:nest.x,y:nest.y},ttl:0.25,max:0.25});
      if(nest.hp<=0){ nest.alive=false; S.cleared++; S.lastClear=S.t; const dd=S.districts[nest.district]; if(dd) delete dd.nest; pop(nest,"AUSGEHOBEN","#1F7A55"); beuteZurueck(nest); }
      return; }
    const avail=S.posts.filter(p=>!p.away&&p.hp>0), mitAus=avail.filter(p=>p.stock>=10).length, str=avail.length*10+mitAus*4;
    const cost=200+S.razzias*100, ok=avail.length>0&&S.money>=cost;
    openSheet(`<h3>Versteck</h3>${beuteText(nest)?`<p style="color:var(--money);font-weight:700">Hier liegt deine Beute: ${beuteText(nest)}. Eine Razzia holt sie zurück.</p>`:""}<p>Verteidigung ${Math.round(nest.hp)}. Du kannst die Wachleute von ${avail.length} Posten abziehen, Stärke etwa ${str}. <b>${mitAus} Posten haben genug Ausrüstung dabei</b>, ihre Leute halten mehr aus und schlagen härter zu. <b>Solange sie weg sind, stehen die Posten leer.</b> Reicht es nicht, verlierst du sie. Gewinnst du, gehört das Viertel dir und du kannst dort einen Laden eröffnen.</p>
      <div class="opt ${ok?"":"off"}" ${ok?'data-go="1"':""}><div><b>Razzia mit allen verfügbaren Wachleuten</b><span>${avail.length?"":"Erst Wachposten bauen."}</span></div><em>${cost}</em></div>`,
      ()=>{ const b=document.querySelector("[data-go]"); if(b) b.onclick=()=>{ S.money-=cost; S.razzias++; S.razziaT=S.t; const ni=S.nests.indexOf(nest);
        avail.forEach(po=>{ po.away=true; const eq=po.stock>=10; if(eq) po.stock-=10;   // Ausrüstung kommt mit
          S.squads.push({x:po.x,y:po.y,home:{x:po.x,y:po.y},post:po,nest:ni,hp:eq?14:10,eq}); }); $("sheet").innerHTML=""; }; });
    return; }
  const mann=S.squads.find(q=>dist(q,{x,y})<0.6);
  if(mann){ const trupp=S.squads.filter(q=>q.nest===mann.nest&&!q.back), n2=S.nests[mann.nest], mit=trupp.filter(q=>q.eq).length;
    openSheet(`<h3>Razzia läuft</h3><p>${trupp.length} Wachleute unterwegs, ${mit} davon mit Ausrüstung. Verteidigung des Verstecks ${Math.round(n2.hp)} von ${Math.round(n2.max)}.</p>
      <p>Tipp auf das Versteck, dann wirft dein Turm ein Netz. Das kostet eine Ausrüstung und hilft deinem Trupp. Netze auf Diebe gehen in der Nähe deiner Leute auch außerhalb des grünen Kreises.</p>
      <div class="opt" data-rc="1"><div><b>Trupp zurückrufen</b><span>Die Wachleute gehen auf ihre Posten zurück. Der Schaden am Versteck bleibt.</span></div><em></em></div>`,
      ()=>{ const b=document.querySelector("[data-rc]"); if(b) b.onclick=()=>{ trupp.forEach(q=>q.back=true); pop(n2,"Trupp kehrt um","#7A7366"); $("sheet").innerHTML=""; }; });
    return; }
  const shopD=S.districts.find(d=>dist(d,{x,y})<0.8);
  if(shopD && S.uhr && !shopD.boutique && shopD.nest===undefined){ const bc=boutiquePreis(), bok=S.money>=bc, c=500+S.districts.filter(d=>d.shop).length*300, sok=!shopD.shop&&S.money>=c;
    openSheet(`<h3>${shopD.n}</h3><p>Hier kannst du eine <b>Boutique</b> für Uhren eröffnen. Jede Boutique hat eigene Käufer, etwa alle vierzehn Sekunden kommt einer. Läuft ein Modell gut, tauchen dort Replikas auf.</p>
      <div class="opt ${bok?"":"off"}" ${bok?'data-bt="1"':""}><div><b>Boutique eröffnen</b><span>Verkauft Uhren aus der Manufaktur.</span></div><em>${bc.toLocaleString("de-DE")}</em></div>
      ${shopD.shop?"":`<div class="opt ${sok?"":"off"}" ${sok?'data-go="1"':""}><div><b>Sneaker-Laden eröffnen</b><span>Verkauft Paare aus Sohle.</span></div><em>${c}</em></div>`}`,
      ()=>{ const b=document.querySelector("[data-bt]"); if(b) b.onclick=()=>{ boutiqueBauen(shopD); $("sheet").innerHTML=""; };
        const g2=document.querySelector("[data-go]"); if(g2) g2.onclick=()=>{ S.money-=c; shopD.shop=true; $("sheet").innerHTML=""; }; });
    return; }
  if(shopD && grossOffen() && shopD.nest===undefined){ const gc=grossPreis(), gok=S.money>=gc, uhren=!!S.uhr;
    const bauGross=(art)=>{ S.money-=gc; S.flagship=art; shopD.flagship=art; if(art==="sohle") shopD.shop=true;
      else boutiqueBauen(shopD,true);   // im Flagship-Preis ist die Boutique schon drin
      once("flagship","Dein Flagship-Store",`<p>In ${shopD.n} steht jetzt dein <b>Flagship-Store</b>. Er verkauft ${art==="sohle"?"Sneaker doppelt so oft und 30 Prozent teurer":"Uhren fast doppelt so oft und teurer"} als ein normaler Laden.</p>
        <p>Er ist aber auch dein größtes Schaufenster: <b>Diebe steuern ihn zuerst an</b>, und ${art==="sohle"?"Fälscher":"Replikas"} tauchen dort doppelt so schnell auf. Stell Wachposten dazu.</p>`);
      $("sheet").innerHTML=""; };
    openSheet(`<h3>${shopD.n}</h3><p><b>Großprojekt.</b> Du hast genug verdient, um einmal im Spiel etwas Großes zu bauen. Danach ist es vergeben.</p>
      <div class="opt ${gok?"":"off"}" ${gok?'data-fs="sohle"':""}><div><b>Flagship-Store für Sneaker</b><span>Verkauft doppelt so oft und 30 Prozent teurer. Zieht Diebe und Fälscher an.</span></div><em>${gc.toLocaleString("de-DE")}</em></div>
      ${uhren?`<div class="opt ${gok?"":"off"}" ${gok?'data-fs="uhren"':""}><div><b>Flagship-Store für Uhren</b><span>Verkauft fast doppelt so oft und teurer. Zieht Crews und Replikas an.</span></div><em>${gc.toLocaleString("de-DE")}</em></div>`:""}
      ${shopD.shop?"":`<div class="opt ${S.money>=500+S.districts.filter(d=>d.shop).length*300?"":"off"}" data-go="1"><div><b>Normaler Laden</b><span>Verkauft Paare aus Sohle.</span></div><em>${500+S.districts.filter(d=>d.shop).length*300}</em></div>`}`,
      ()=>{ document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>bauGross(b.dataset.fs));
        const g2=document.querySelector("[data-go]"); if(g2) g2.onclick=()=>{ const c2=500+S.districts.filter(d=>d.shop).length*300; if(S.money<c2) return; S.money-=c2; shopD.shop=true; $("sheet").innerHTML=""; }; });
    return; }

        const w=document.querySelector("[data-wp]"); if(w) w.onclick=()=>{ postBauen(Math.floor(shopD.x)+.5,Math.floor(shopD.y)+.5); $("sheet").innerHTML=""; }; });

function truckState(tr){ return tr.parked?"leer":tr.wait?"voll":"fährt"; }
function removeTruck(src){ const i=S.sources.indexOf(src);
  const cand=S.trucks.filter(t=>t.src===i).sort((a,b)=>(b.parked?2:b.dir===-1?1:0)-(a.parked?2:a.dir===-1?1:0))[0];
  if(!cand) return; if(cand.cargo){ const room=S.lagerCap-S.lager[src.k]; S.lager[src.k]+=Math.max(0,Math.min(room,cand.cargo)); }
  S.trucks=S.trucks.filter(t=>t!==cand); src.trucks--; }
function fleetSheet(){ reopen=fleetSheet;

  S.sources.forEach((src,i)=>{ const trs=S.trucks.filter(t=>t.src===i);

      <button data-rm="${i}" ${trs.length?"":"disabled"}>−</button><div class="cnt">${trs.length}</div>
      <button data-ad="${i}" ${canAdd?"":"disabled"} title="${addCost}">+</button></div>`; });
  const vok=fleetUsed()<S.fleet&&S.money>=150;
  h+=`<div class="frow"><div><b>Versorgungswagen</b><span>Bringt Ausrüstung zu Posten außerhalb des grünen Kreises</span></div>
    <button data-vr="1" ${S.vans.length?"":"disabled"}>−</button><div class="cnt">${S.vans.length}</div><button data-va="1" ${vok?"":"disabled"} title="150">+</button></div>`;
  const fok=S.money>=fc;
  h+=`<div class="opt ${fok?"":"off"}" ${fok?'data-fl="1"':""}><div><b>Fuhrpark vergrößern</b><span>Platz für einen Transporter mehr.</span></div><em>${fc}</em></div>`;
  const lc=Math.round(300*Math.pow(1.35,Math.max(0,S.lagerCap-40)/20)), lok=S.money>=lc;
  h+=`<div class="opt ${lok?"":"off"}" ${lok?'data-lg="1"':""}><div><b>Lager vergrößern</b><span>Jedes Fach 20 Plätze mehr.</span></div><em>${lc}</em></div>`;
  const ac=Math.round(250*Math.pow(1.5,(S.ammoCap-60)/40)), aok=S.money>=ac;
  h+=`<div class="opt ${aok?"":"off"}" ${aok?'data-al="1"':""}><div><b>Ausrüstungslager vergrößern</b><span>Jetzt ${S.ammoCap}. 40 mehr, damit der Ausrüster länger vorarbeiten kann.</span></div><em>${ac}</em></div>`;
  h+=`<p style="margin-top:4px">Plus bei einer neuen Route kostet den Streckenbau, jeder weitere Transporter 90.</p>`;
  openSheet(h,()=>{
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ removeTruck(S.sources[+b.dataset.rm]); fleetSheet(); });
    document.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{ const src=S.sources[+b.dataset.ad], c=src.trucks?90:routeCost(src); if(S.money<c) return; S.money-=c; addTruck(src); fleetSheet(); });
    const f=document.querySelector("[data-fl]"); if(f) f.onclick=()=>{ S.money-=fc; S.fleet++; fleetSheet(); };
    const al=document.querySelector("[data-al]"); if(al) al.onclick=()=>{ S.money-=ac; S.ammoCap+=40; fleetSheet(); };
    const va=document.querySelector("[data-va]"); if(va) va.onclick=()=>{ if(S.money<150) return; S.money-=150; S.vans.push({state:"home",cargo:0,pos:{x:HQ.x,y:HQ.y},d:0}); fleetSheet(); };
    const vr=document.querySelector("[data-vr]"); if(vr) vr.onclick=()=>{ const v=S.vans.find(v=>v.state==="home")||S.vans[0]; if(v){ S.ammo+=v.cargo||0; S.vans=S.vans.filter(o=>o!==v); } fleetSheet(); };
    // (Wagen fahren Rundtouren)
    const g=document.querySelector("[data-lg]"); if(g) g.onclick=()=>{ S.money-=lc; S.lagerCap+=20; fleetSheet(); };

function addTruck(src){ const i=S.sources.indexOf(src), p=pathOf(src); src.trucks++;

<script>
// Anzeige: Kopfzeile, Markt, Tipps, Alarm, Übersicht, Ansicht wechseln, Startfenster
function shoeIcon(k,w){ w=w||22; const high=k==="hightop";

/* ================= Alarm ================= */

function alarmCheck(){ releaseDeferred(); marketHint(); fwHint(); shopHint(); intakeHint();
  if(!S||!S.awake) { $("alarm").style.display="none"; return; }
  const near=S.raiders.filter(r=>!r.flee&&dist(r,HQ)<SUPPLY_R+1.5).length;
  const hot = near>=2 || S.t-(S.alarmT||-99)<5;
  $("tStadt").classList.toggle("alarm", hot && view!=="stadt");
  if(!hot||view==="stadt"||$("overlay").innerHTML){ $("alarm").style.display="none"; return; }
  if(!S.seen.alarm1){ S.seen.alarm1=true; paused=true; S.alarmPause=true; setPauseUI(); if(!tutOn) tutI=TUT.length; tutOn=true;
    tutQ.push({id:"alarm1", el:()=>$("tStadt"), done:()=>view==="stadt",
      t:"Alarm. Während du im Turm bist, greifen Diebe deine Stadt an. Das Spiel wartet kurz, wechsel in die Stadt. Wenn das Stadt-Feld rot blinkt, ist dort etwas los."}); return; }
  if(tutOn&&tutQ.length){ $("alarm").style.display="none"; return; }
  const what = near>=2 ? `${near} Diebe nah an deinem Turm` : "Gerade wird etwas überfallen";
  const al=$("alarm");
  if(al.dataset.what!==what){ al.dataset.what=what; al.innerHTML=`<div class="ab"><div><b>Alarm</b><br><span>${what}</span></div><button id="goCity">Zur Stadt</button></div>`; }
  al.style.display="block"; al.onclick=()=>switchView("stadt");
}

/* ================= Übersicht ================= */
// Katya hat auf den Court getippt, um herauszufinden, wie man ihn baut. Hier steht es.
// Was gerade markiert werden soll. Der Melder setzt es, die Zeichnung liest es.
// Katyas Test: Text unten wird überlesen, ein Ring am Objekt nicht.
let melderZiel=null;
// Katya hat auf die Uhr getippt, um zu sehen, in welcher Reihenfolge die Maschinen stehen müssen.
function uhrSheet(k){ reopen=()=>uhrSheet(k); const M=UHREN[k], U=S.uhr, W=uhrWerk();
  const hat=t=>W.floors.some(F=>F.slots.some(m=>m&&m.t===t));
  const zeile=(von,masch,raus,da)=>`<div class="frow" style="grid-template-columns:1fr auto"><div><b>${MACH2[masch].n}</b><span>${von} → ${raus}</span></div>
    <div style="font-weight:800;color:${da?"var(--money)":"var(--bad)"}">${da?"steht":"fehlt"}</div></div>`;
  let h=`<h3>${M.n}</h3><p>Eine Uhr entsteht in dieser Reihenfolge. Jede Maschine muss <b>in Laufrichtung vor</b> der nächsten stehen, die Endmontage also zuletzt.</p>`;
  h+=zeile("Metall","giess","ein Gehäuse",hat("giess"));
  h+=zeile("Sand","ofen","Glas",hat("ofen"));
  h+=zeile("Metall","fein","ein Zahnrad, drei davon je Uhrwerk",hat("fein"));
  h+=zeile("Drei Zahnräder","werk","ein Uhrwerk",hat("werk"));
  h+=`<div class="frow" style="grid-template-columns:1fr auto"><div><b>Lederband</b><span>Schneidet <b>Sohle</b> unten für dich. Stell dort den Regler am Zuschnitt höher, der Lieferwagen bringt sie hoch.</span></div>

// Der Melder zeigt nur den ersten Satz. Wer mehr wissen will, tippt darauf.
// Katyas Test: Lange Meldungen werden überlesen, kurze nicht.
function tipKurz(html,mitKnopf){
  const teile=html.split(/(?<=\.)\s+/);
  const ersterSatz=teile.shift()||html, rest=teile.join(" ");
  return `<span class="kurz">${ersterSatz}</span>${rest?`<span class="rest">${rest}</span>`:""}`
    +(mitKnopf?` <button id="tipGo">Zeig mir wo</button>`:"");
}
// Der Melder: sucht die erste Ursache, die gerade bremst, und liefert Text und Ziel für "Zeig mir wo"
function stockung(){
  if(aktivesWerk().name==="uhren") return stockungUhren();
  const rohNamen={leder:"Leder",gummi:"Gummi",metall:"Metall"}, quelle=k=>S.sources.find(s=>s.k===k&&s.left>0);
  const braucht={bench:["leder","gummi"],cut:["leder"],press:["gummi"],equip:["metall","gummi"]};
  // Wartet eine Maschine gerade auf diesen Rohstoff?
  const wartet=k=>S.floors.some(F=>F.slots.some(m=>m&&!m.busy&&!m.out&&(braucht[m.t]||[]).includes(k)&&!(m.buf[k]>0)));
  // 1. Das Konto blutet: mehr laufende Kosten als Verkäufe
  if(S.money<40&&S.trucks.length){ const kosten=Math.round((fleetUsed()-S.trucks.filter(t=>t.wait||t.parked).length*2/3)*truckUpkeep*60), ein=perMin("sold")*Math.round(MODELS.runner.p0*0.6);
    if(kosten>ein) return {t:`<b>Du zahlst mehr, als du einnimmst.</b> Dein Fuhrpark kostet etwa ${kosten} pro Minute, verkauft hast du zuletzt für ungefähr ${ein}. Zieh einen Transporter ab, oder bring die Ware in die Läden.`,
      go:()=>{ switchView("stadt"); guideEl(()=>$("fleet"),"Hier ziehst du einen Transporter ab. Er kostet auch dann, wenn er nur wartet."); }}; }
  // 1. Nachschub reicht nicht: Lager leer und jemand wartet darauf
  for(const k of ["leder","gummi","metall"]){ const rein=perMin("in_"+k), raus=perMin("use_"+k);
    if(S.lager[k]<2 && wartet(k) && quelle(k))
      return {t:`<b>Zu wenig ${rohNamen[k]}.</b> Deine Maschinen warten darauf. Es kommen ${rein} pro Minute an, verbraucht werden ${raus}. Bau eine Route oder schick mehr Transporter.`,
        zeig:{art:"stadt", ziel:quelle(k), text:"Hier gibt es "+rohNamen[k]},
        go:()=>{ switchView("stadt"); guideCity(quelle(k), `Hier holst du ${rohNamen[k]}. Tipp die Quelle an und schick noch einen Transporter los.`); }}; }
  // 2. Fuhrpark ist voll, deshalb kommt nichts nach
  if(fleetUsed()>=S.fleet && ["leder","gummi","metall"].some(k=>S.lager[k]<2&&wartet(k)))
    return {t:`<b>Dein Fuhrpark ist voll.</b> Mehr Transporter gehen erst, wenn du ihn vergrößerst.`, go:()=>{ switchView("stadt"); guideEl(()=>$("fleet"),"Hier vergrößerst du den Fuhrpark."); }};
  // 3. Lagerfach voll, Transporter stehen
  for(const k of ["leder","gummi","metall"]) if(fachVoll(k)&&S.trucks.some(t=>t.wait&&S.sources[t.src].k===k))
    return {t:`<b>Das ${rohNamen[k]}fach ist voll</b>, seine Transporter warten. Entweder mehr Maschinen, die ${rohNamen[k]} verbrauchen, oder im Fuhrpark einen abziehen.`,
      zeig:{art:"fuhrpark"},
      go:()=>{ switchView("stadt"); guideEl(()=>$("fleet"),"Im Fuhrpark kannst du Transporter abziehen oder das Lager vergrößern."); }};
  // 3b. Der Aufzug staut: Kabine voll und darunter wartet Ware
  { const W3=aktivesWerk();
    const f=W3.lifts.findIndex((l,i)=>l.q.length>=2&&(l.jam||0)>20&&l.lvl<2);
    if(f>=0) return {t:`<b>Der Aufzug kommt nicht hinterher.</b> Er ist voll, die Etage darunter staut sich. Tipp ihn an und mach ihn schneller.`,
      zeig:{art:"aufzug", f},
      go:()=>{ switchView("turm"); guide({tw:()=>liftRect(f)},"Das ist der Aufzug. Tipp ihn an und bau ihn aus, dann fährt er doppelt so oft."); }}; }
  // 4. Warenannahme zu langsam
  { const f=S.intakes.find(fi=>((S.intakeLvl||{})[fi]||0)<2 && ["leder","gummi","metall"].some(k=>wartet(k)));
    if(f!==undefined && lagerSum()>20)
      return {t:`<b>Deine Warenannahme kommt nicht hinterher.</b> Material ist da, die Maschinen warten trotzdem. Bau die Annahme aus.`,
        zeig:{art:"annahme", f},
        go:()=>{ switchView("turm"); guide({tw:()=>doorRect(f)},"Das ist die Warenannahme. Tipp sie an und bau sie aus, dann liefert sie doppelt so oft."); }}; }
  // 4b. Zu viele Maschinen auf einer Etage: Das Band schafft nur etwa ein Teil pro Takt
  { const W2=aktivesWerk();
    for(let f=0;f<W2.floors.length;f++){ const F=W2.floors[f];
      const stehen=F.slots.filter(m=>m&&(m.blockT||0)>40).length;
      if(stehen>=2&&F.slots.filter(Boolean).length>=5)
        return {t:`<b>Zu viele Maschinen auf einer Etage.</b> Das Band schafft nur etwa ein Teil pro Takt aus der Etage heraus. ${stehen} Plätze vorne stehen deshalb still. Bau eine Maschine weniger oder verteil sie auf mehrere Etagen.`,
          zeig:{art:"platz", f, i:F.slots.findIndex(m=>m&&(m.blockT||0)>40)},
          go:()=>{ switchView("turm"); const i=F.slots.findIndex(m=>m&&(m.blockT||0)>40); guide({tower:()=>[f,i]},"Diese Maschine wird ihr Teil nicht los, weil vor ihr alles voll ist. Hinter ihr stehen die Maschinen, die näher am Ausgang sind."); }}; } }
  // 5. Schuhe stapeln sich, ein Laden fehlt
  { const fin=Object.values(S.fin).reduce((a,b)=>a+b,0), her=perMin("mk_schuh"), verk=perMin("sold");
    const frei=S.districts.find(d=>!d.shop&&d.nest===undefined&&d.n!=="Zuhause");
    if(fin>15&&her>verk+5&&frei)
      return {t:`<b>Deine Läden kommen nicht hinterher.</b> ${her} Schuhe pro Minute hergestellt, ${verk} verkauft. Ein Laden mehr verkauft den Rest.`,
        zeig:{art:"stadt", ziel:frei, text:"Laden bauen"},
        go:()=>{ switchView("stadt"); guideCity(frei,`Hier kannst du einen Laden eröffnen. Er hat eigene Kunden, der Preis fällt dort getrennt.`); }}; }
  // 5c. Nur Werkbänke: Damit gibt es nie Court oder Hightop, also auch keine Fashion Week
  { const benches=S.floors.reduce((a,F)=>a+F.slots.filter(m=>m&&m.t==="bench").length,0);
    const asm=S.floors.some(F=>F.slots.some(m=>m&&m.t==="asm"));
    if(S.factory&&benches>=3&&!asm)
      return {t:`<b>Deine Werkbänke bauen nur Runner.</b> Für Court und Hightop brauchst du eine <b>Montage</b>, und ohne die beiden kommst du nicht in die Fashion Week.`,
        zeig:{art:"platz", f:0, i:S.floors[0].slots.findIndex(m=>!m)},
        go:()=>{ switchView("turm"); const frei=firstEmptyAfterAsm()||[0,S.floors[0].slots.findIndex(m=>!m)];
          guide({tower:()=>frei, opt:'[data-b="asm"]', optT:"Nimm die Montage.", done:()=>S.floors.some(F=>F.slots.some(m=>m&&m.t==="asm"))},
            "Hier passt eine Montage hin. Sie baut aus Schaft und Sohle jedes Modell, das du entworfen hast."); }}; }
  // 6. Die Forschung kriecht, weil kaum jemand das Modell baut, dessen Muster fehlt
  { const T=resTech(), e=T?resEta():null;
    if(T&&findM(m=>m.t==="lab")&&e!==null&&e!==-1&&e>240){
      const f=resFehlt(T,S.resProg,MODELS)[0];
      const stelle=f&&findM(m=>m.t==="asm"&&m.model!==f.m);
      if(f&&stelle&&S.open[f.m]){ const jetzt=MODELS[S.floors[stelle[0]].slots[stelle[1]].model].n;
        const wie = e===Infinity ? `Bei deinem Labor kommt kein einziger an.` : `So wenige kommen bei deinem Labor an, dass es noch ${Math.ceil(e/60)} Minuten dauert.`;
        return {t:`<b>${T.n} braucht noch ${f.r} ${f.n}.</b> ${wie} Stell eine Montage von ${jetzt} auf ${f.n} um.`,
          go:()=>{ switchView("turm"); guide({tower:()=>stelle, opt:`[data-mo="${f.m}"]`, optT:`Wähl ${f.n}.`, done:()=>!!findM(m=>m.t==="asm"&&m.model===f.m)},
            `Diese Montage baut ${jetzt}. Stell sie auf ${f.n} um, dann bekommt dein Labor die Muster, die fehlen.`); }}; } } }
  // 5b2. Fälscher drücken den Preis, und niemand versiegelt
  { const buden=S.fakes.length, siegel=S.floors.some(F=>F.slots.some(m=>m&&m.t==="seal"));
    if(buden>=5&&!siegel)
      return {t:`<b>${buden} Fälscherbuden drücken deine Preise.</b> Ein <b>Siegel</b> im Turm, in Laufrichtung hinter einer Montage, schließt sie und hält neue fern.`,
        zeig:{art:"platz", f:(firstEmptyAfterAsm()||[0,0])[0], i:(firstEmptyAfterAsm()||[0,0])[1]},
        go:()=>{ switchView("turm"); guide({tower:firstEmptyAfterAsm, opt:'[data-b="seal"]', optT:"Nimm das Siegel.",
          done:()=>S.floors.some(F=>F.slots.some(m=>m&&m.t==="seal"))},
          "Hier passt ein Siegel hin, in Laufrichtung hinter einer Montage. Versiegelte Paare bringen mehr und locken keine Fälscher an."); }}; }
  return null;
}
// Der Melder für die Manufaktur: sagt, welches Glied der Kette fehlt
function stockungUhren(){ const W=aktivesWerk(), U=S.uhr;
  const hat=t=>W.floors.some(F=>F.slots.some(m=>m&&m.t===t));
  const namen={metall:"Metall",sand:"Sand",band:"Lederbänder",gehaeuse:"Gehäuse",glas:"Glas",zahnrad:"Zahnräder",uhrwerk:"Uhrwerke"};
  const quelle=k=>S.sources.find(s=>s.k===k&&s.left>0);
  // Kette von hinten: Was fehlt der Endmontage?
  if(!hat("endm")) return {t:`<b>Ohne Endmontage keine Uhr.</b> Sie braucht Gehäuse, Glas, ein Uhrwerk und ein Lederband von Sohle.`, go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Stell hier eine Endmontage hin. Davor brauchst du Gießerei, Glasofen und die Uhrwerk-Montage.")};
  if(!hat("werk")) return {t:`<b>Es fehlt die Uhrwerk-Montage.</b> Drei Zahnräder werden dort ein Uhrwerk, und ohne Uhrwerk baut die Endmontage nichts.`, go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Hier passt die Uhrwerk-Montage hin, in Laufrichtung vor die Endmontage.")};
  if(!hat("fein")) return {t:`<b>Es fehlt die Feinmechanik.</b> Sie macht aus Metall Zahnräder, und davon braucht ein Uhrwerk drei Stück.`, go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Hier passt die Feinmechanik hin. Für eine Uhrwerk-Montage brauchst du etwa drei davon.")};
  if(!hat("giess")) return {t:`<b>Es fehlt die Gießerei.</b> Sie macht aus Metall die Gehäuse.`, go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Hier passt die Gießerei hin.")};
  if(!hat("ofen")) return {t:`<b>Es fehlt der Glasofen.</b> Er macht aus Sand das Glas.`, go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Hier passt der Glasofen hin. Den Sand holst du aus der Sandgrube im Norden.")};
  // Rohstoffe
  for(const k of ["metall","sand"]) if(U.lager[k]<2 && quelle(k)){
    const falsch = k==="metall" && S.sources.some(s=>s.k==="metall"&&s.trucks>0&&zielVon(s)==="sohle");
    return {t:`<b>Zu wenig ${namen[k]}.</b> ${falsch?"Deine Metallroute liefert an Sohle. Tipp die Quelle an und stell sie auf Manufaktur um.":"Deine Maschinen warten darauf."}`,
      go:()=>{ switchView("stadt"); guideCity(quelle(k),`Von hier kommt ${namen[k]}. Tipp die Quelle an${k==="metall"?" und stell ein, an welches Haus sie liefert":" und bau eine Route"}.`); }}; }
  if(U.lager.band<2){ const anteil=Math.round((S.bandAnteil||0)*100);
    return {t:`<b>Keine Lederbänder.</b> ${anteil?"Der Lieferwagen ist unterwegs oder wurde überfallen.":"Die Bänder kommen aus deiner alten Fabrik. In Sohle schneidet gerade niemand welche."} Ohne Band steht die Endmontage.`,
      zeig:{art:"haus", id:"sohle"},
      go:()=>{ S.haus="sohle"; switchView("turm"); const c=findM(m=>m.t==="cut"); if(c) guide({tower:()=>c},"Tipp einen Zuschnitt an und stell den Regler für Lederbänder höher. Der Lieferwagen bringt sie dann nach oben."); }};
  }
  // Zwischenteile
  const fehlt=["zahnrad","gehaeuse","glas","uhrwerk"].find(k=>W.floors.some(F=>F.slots.some(m=>m&&!m.busy&&!m.out&&(bedarfVon(W,m)||{})[k]&&!(m.buf[k]>0))));
  if(fehlt) return {t:`<b>Es fehlen ${namen[fehlt]}.</b> ${fehlt==="zahnrad"?"Eine Uhrwerk-Montage braucht drei Zahnräder je Uhrwerk, also etwa drei Feinmechaniken.":"Stell eine Maschine mehr davor."}`, go:null};
  // Forschung der Manufaktur: ohne Atelier geht nichts, und das Atelier braucht das richtige Modell
  { const T=resTech2();
    if(T&&!hat("atelier")) return {t:`<b>${T.n} kommt nicht voran.</b> Dafür brauchst du ein <b>Atelier</b> im Haus. Es nimmt fertige Uhren als Muster.`,
      go:()=>guide({tower:()=>[0,W.floors[0].slots.findIndex(x=>!x)]},"Hier passt ein Atelier hin, in Laufrichtung hinter der Endmontage. Was dort landet, verkaufst du nicht.")};
    if(T){ const f=resFehlt(T,U.resProg,UHREN)[0];
      if(f&&!U.open[f.m]) return {t:`<b>${T.n} braucht ${f.r} ${f.n}.</b> Das Modell ist noch nicht entworfen. Unten beim Markt entwirfst du es.`, go:null};
      if(f&&!W.floors.some(F=>F.slots.some(m=>m&&m.t==="endm"&&m.model===f.m)))
        return {t:`<b>${T.n} braucht noch ${f.r} ${f.n}.</b> Deine Endmontage baut gerade etwas anderes, im Atelier kommt nichts davon an.`,
          go:()=>guide({tower:()=>findMW(W,m=>m.t==="endm"), opt:`[data-mo="${f.m}"]`, optT:`Wähl ${f.n}.`},`Stell diese Endmontage auf ${f.n} um, dann bekommt das Atelier die richtigen Muster.`)}; } }
  const lager=Object.values(U.fin).reduce((a,b)=>a+b,0);
  if(lager>8) return {t:`<b>${lager} Uhren warten im Lager.</b> In der Boutique kauft nur alle paar Sekunden jemand. Ein Zertifikat oder das teurere Modell bringt mehr als mehr Stückzahl.`, go:null};
  return null;
}
function guideCity(ziel,text){ $("sheet").innerHTML=""; if(!tutOn) tutI=TUT.length; tutOn=true;
  tutQ.push({id:"s"+Math.round(S.t*10), view:"stadt", city:()=>ziel, info:true, t:text}); }
function guideEl(el,text){ $("sheet").innerHTML=""; if(!tutOn) tutI=TUT.length; tutOn=true;
  tutQ.push({id:"s"+Math.round(S.t*10), view:"stadt", el, info:true, t:text}); }
function switchView(v){ view=v; if(v==="stadt"&&S&&S.alarmPause){ S.alarmPause=false; paused=false; setPauseUI(); } $("tTurm").classList.toggle("on",v==="turm"); $("tStadt").classList.toggle("on",v==="stadt");
  $("turmView").style.display=v==="turm"?"":"none"; $("stadtView").style.display=v==="stadt"?"":"none"; if(v==="stadt") size(); }
function setPauseUI(){ $("pause").textContent=paused?"Weiter":"Pause"; $("pause").classList.toggle("on",paused); document.body.classList.toggle("paused",paused); }
function intro(){ paused=true;
  // Wer wiederkommt, spielt weiter. Kein Fenster mit "Neues Spiel" direkt daneben, das kostet sonst eine ganze Partie.
  if(hasSave()&&loadGame()){ $("overlay").innerHTML=""; paused=false; setPauseUI(); return; }
  $("overlay").innerHTML=`<div class="over"><div class="box"><h2>Sohle</h2>
    <p>Ein Kinderzimmer, zehn Stück Leder, zehn Stück Gummi. Du nähst die ersten Sneaker selbst.</p>
    <p>Später kommen Mitarbeiter, Maschinen, Etagen. Dein Material holst du aus der <b>Stadt</b>, verkauft wird in deinen Läden. Und irgendwann merken die falschen Leute, dass bei dir etwas zu holen ist.</p>
    <button id="go">Anfangen</button></div></div>`;
  $("go").onclick=()=>{ $("overlay").innerHTML=""; paused=false; setPauseUI(); tutOn=true; tutI=0; }; }
</script>
<script>
// Speichern im Browser
/* ================= Speichern ================= */
const SAVE_KEY="sohle.save.v1";
// In eingebetteten Seiten sperren Safari und die App den Speicher, bis der Spieler die Seite berührt hat.
// Deshalb: erst prüfen, bei Bedarf Zugriff anfordern, und ehrlich sagen, wenn es nicht geht.
let speicherGeht=null;
function pruefeSpeicher(){ try{ localStorage.setItem("sohle.probe","1"); localStorage.removeItem("sohle.probe"); speicherGeht=true; }
  catch(e){ speicherGeht=false; } return speicherGeht; }
async function speicherFreigeben(){ if(speicherGeht) return true;
  try{ if(document.hasStorageAccess && !(await document.hasStorageAccess())){ await document.requestStorageAccess(); } }catch(e){}
  return pruefeSpeicher(); }
// Wo der Browser den dauerhaften Speicher sperrt (eingebettete Seiten auf dem iPhone),
// bleibt der Stand wenigstens für diese Sitzung erhalten: sessionStorage überlebt das Neuladen,
// window.name überlebt es auch dann, wenn selbst das gesperrt ist.
const NAME_KOPF="sohle.save:";
function schreibeStand(text){ let wohin=[];
  try{ localStorage.setItem(SAVE_KEY,text); wohin.push("dauerhaft"); speicherGeht=true; }catch(e){ speicherGeht=false; }
  try{ sessionStorage.setItem(SAVE_KEY,text); wohin.push("Sitzung"); }catch(e){}
  try{ window.name=NAME_KOPF+text; wohin.push("Fenster"); }catch(e){}
  return wohin; }
// Ältere Fassungen dieser Seite haben unter anderen Namen gespeichert. Die werden mitgelesen,
// damit ein Stand nicht verloren geht, nur weil sich der Name geändert hat.
const ALT_KEYS=["sohle.save"+".v1"];   // bewusst zusammengesetzt, damit die englische Fassung den Namen nicht mitübersetzt
function lieseStand(){
  try{ const t=localStorage.getItem(SAVE_KEY); if(t) return t; }catch(e){}
  for(const k of ALT_KEYS){ if(k===SAVE_KEY) continue;
    try{ const t=localStorage.getItem(k); if(t) return t; }catch(e){} }
  try{ const t=sessionStorage.getItem(SAVE_KEY); if(t) return t; }catch(e){}
  try{ if(window.name&&window.name.startsWith(NAME_KOPF)) return window.name.slice(NAME_KOPF.length); }catch(e){}
  return null; }
function saveGame(){ try{ if(!S) return;
  const data=Object.assign({},S,{
    fakes:S.fakes.map(f=>Object.assign({},f,{d:S.districts.indexOf(f.d)})),
    vans:S.vans.map(v=>({state:"home",cargo:v.cargo||0,pos:{x:HQ.x,y:HQ.y},d:0,stops:[]})),
    squads:[], shots:[], pops:[], caught:[], cars:[]});
  schreibeStand(JSON.stringify({v:1, S:data, tut:{on:tutOn,i:tutI}, at:Date.now()}));
}catch(e){} }
function loadGame(){ try{ const raw=lieseStand(); if(!raw) return false; const o=JSON.parse(raw); if(!o||!o.S) return false;
  S=o.S; S.fakes=S.fakes.map(f=>Object.assign(f,{d:S.districts[f.d]})).filter(f=>f.d);
  S.vans.forEach(v=>{ S.ammo+=v.cargo||0; v.state="home"; v.cargo=0; v.stops=[]; });
  if(S.exited&&S.exitMoney&&!S.exitBezahlt){ S.money+=S.exitMoney; S.exitBezahlt=true; }   // Auszahlung wurde früher vergessen
  S.sources.forEach(s=>{ s.left=s.max; s.gone=false; });   // Quellen gehen nicht mehr aus
  S.posts.forEach(po=>po.away=false); S.caught=S.caught||[]; S.cars=S.cars||[]; S.research=S.research||{}; S.decoys=S.decoys||[]; S.parts=S.parts||{schaft:0,sohle:0}; S.rp=S.rp||{runner:0,court:0,hightop:0}; S.resProg=S.resProg||{}; S.curRes=S.curRes||null;
  tutOn=o.tut&&o.tut.on; tutI=(o.tut&&o.tut.i)||0; if(tutI>=TUT.length||!tutOn&&S.factory) S.tutDone=true; return true; }catch(e){ return false; } }
const hasSave=()=>!!lieseStand();
function loescheStand(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  try{ sessionStorage.removeItem(SAVE_KEY); }catch(e){} try{ window.name=""; }catch(e){} }
</script>
<script>
// Start: neues Spiel, Eingaben verbinden, Spielschleife
/* ================= Start ================= */
newGame();
let pressing=false;
if(typeof window!=="undefined" && typeof requestAnimationFrame!=="undefined"){
  $("tTurm").onclick=()=>switchView("turm"); $("tStadt").onclick=()=>switchView("stadt");
  $("tForsch").onclick=()=>{ if(S.uhr&&S.haus==="uhren") forschungSheet2(); else if(S.uhr) openSheet(`<h3>Forschung abgeschlossen</h3><p>Sohle hat alles erforscht. Die Manufaktur oben hat ihre eigene Forschung.</p>`); else if(S.floors.length>=3) researchSheet(); else openSheet(`<h3>Forschung</h3><p>Die Forschung öffnet sich, sobald dein Haus <b>drei Etagen</b> hat. Bis dahin: Produktion und Stadt in den Griff bekommen.</p>`); };
  $("pause").onclick=()=>{ paused=!paused; setPauseUI(); };
  $("tip").onclick=()=>$("tip").classList.toggle("auf");   // Tipp auf den Melder zeigt den Rest
  $("fleet").onclick=fleetSheet; $("resbar").onclick=()=>$("tForsch").onclick(); $("stock").onclick=overview;
  tcv.addEventListener("click",e=>{ const r=tcv.getBoundingClientRect(), x=(e.clientX-r.left)/TS, y=(e.clientY-r.top)/TS;
    for(let k=hits.length-1;k>=0;k--){ const h=hits[k]; if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ h.act(); return; } } });
  cv.addEventListener("click",e=>{ const r=cv.getBoundingClientRect(), y=(e.clientY-r.top)/T-TOPR();
    if(y<0&&zoneState()!=="open"){ zoneTap(); return; }
    cityTap((e.clientX-r.left)/T,y); });
  addEventListener("resize",()=>{ if(view==="stadt") size(); });
  pruefeSpeicher();
  addEventListener("pointerdown",()=>{ pressing=true; if(speicherGeht===false) speicherFreigeben(); },true); addEventListener("pointerup",()=>setTimeout(()=>pressing=false,30),true);
  let acc=0,last=performance.now(),ui=0,saveT=0;
  (function loop(now){ const dt=Math.min(0.25,(now-last)/1000); last=now;
    if(!paused){ acc+=dt; while(acc>=DT){ step(); acc-=DT; } }
    if(view==="stadt") drawCity(); else drawTower(dt); tutUpdate(); sheetAuffrischen(dt); ui+=dt; if(ui>0.2&&!pressing){ ui=0; if(view==="turm") renderHand(); hud(); }
    saveT+=dt; if(saveT>2){ saveT=0; saveGame(); }
    requestAnimationFrame(loop); })(last);
  addEventListener("pagehide",saveGame); document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); });
  renderTower(); hud(); intro();
}
</script>
